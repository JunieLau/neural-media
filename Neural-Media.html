", "label": {"en": "K's own site lists the three neural media essays", "zh": "K 的个人网站列出了三篇神经媒体文章"}}]}, {"id": "2024-04-30-k-interpellation-post", "date": "2024-04-30", "types": ["post"], "added": "2026-10-21", "date_display": {"en": "30 Apr 2024 (29 Apr Europe/US time)", "zh": "2024 年 4 月 30 日（欧美时间 29 日）"}, "title": {"en": "K on X: sharing “Neural Interpellation”", "zh": "K 在 X 上分享《神经询唤》"}, "summary": {"en": "K's pinned post announcing the second Gropius Bau neural media essay.", "zh": "K 的置顶推文，宣布为 Gropius Bau 撰写的第二篇神经媒体文章发表。"}, "url": "https://x.com/kalladomcdowell/status/1785076018031546590", "source": {"en": "X (@kalladomcdowell)", "zh": "X（@kalladomcdowell）"}}, {"id": "2024-03-19-new-models", "date": "2024-03-20", "types": ["podcast"], "added": "2026-10-21", "date_display": {"en": "20 Mar 2024 (19 Mar US time)", "zh": "2024 年 3 月 20 日（美国时间 19 日）"}, "title": {"en": "New Models NM 76: K Allado-McDowell on Neural Media", "zh": "New Models 第 76 期：K Allado-McDowell 谈神经媒体"}, "summary": {"en": "Recorded in Berlin after K's Gropius Bau talk. K extends Fred Turner into four media eras (broadcast, immersive, network, neural), each shaping a different subject. Neural media emerged around 2010 with algorithmic timelines: high-dimensional space, hallucinated content, identity as embedding. K uses 'neural' rather than 'AI' to leave room for Neuralink, neuroscience and pharmacology, argues neural media actively sense us, and proposes communities train their own models against 'semiotic enclosure'. Subscribers only at first; free from March 2025.", "zh": "录于柏林，K 刚在 Gropius Bau 做完讲座。K 在 Fred Turner 的基础上把媒介分成广播、沉浸、网络、神经四个时代，每种媒介都会塑造一种不同的主体。神经媒体约在 2010 年随算法时间线出现：空间是高维的，内容是「幻觉」，身份是 embedding。K 说用「神经」而不只说「AI」，是为了容纳 Neuralink、神经科学和药理学；神经媒体「一直在主动感知我们」；出路是让社群训练自己的模型，避免集体性被少数公司「符号圈地」。最初只对订阅者开放，2025 年 3 月起免费。"}, "url": "https://newmodels.substack.com/p/nm-76-k-allado-mcdowell-on-neural", "source": {"en": "New Models", "zh": "New Models"}, "internal": {"href": "new-models.html#e-nm76", "label": {"en": "Full summary on the New Models page", "zh": "在 New Models 专页查看详细摘要"}}}, {"id": "2024-01-14-gropius-lecture", "date": "2024-01-14", "types": ["talk"], "added": "2026-10-21", "date_display": {"en": "14 Jan 2024 (16:00 Berlin, 23:00 China time)", "zh": "2024 年 1 月 14 日（柏林时间 16:00，北京时间 23:00）"}, "title": {"en": "Gropius Bau lecture: “Designing Neural Media”", "zh": "Gropius Bau 讲座：《设计神经媒体》"}, "summary": {"en": "K's live lecture at Gropius Bau, Berlin, on how AI mirrors and shapes humanity, part of Ether's Bloom, the Gropius Bau programme on artificial intelligence.", "zh": "K 在柏林 Gropius Bau 的现场讲座，探讨 AI 如何映照并塑造人类，属于 Gropius Bau 的人工智能项目「Ether's Bloom」。"}, "url": "https://www.berlinerfestspiele.de/gropius-bau/programm/2023/ausstellungen/kuenstliche-intelligenz/veranstaltungen/designing-neural-media", "source": {"en": "Gropius Bau / Berliner Festspiele (event page)", "zh": "Gropius Bau / 柏林艺术节（活动页面）"}, "links": [{"url": "https://x.com/gropiusbau/status/1744320481409245517", "label": {"en": "Gropius Bau post about the lecture", "zh": "Gropius Bau 关于讲座的推文"}}, {"url": "https://x.com/gropiusbau/status/1739571804639784971", "label": {"en": "Earlier Gropius Bau announcement", "zh": "Gropius Bau 更早的预告"}}]}, {"id": "2023-12-gropius-ai-talks-ep3", "date": "2023-12-01", "types": ["podcast"], "added": "2026-10-21", "date_display": {"en": "Between Nov 2023 and Mar 2024 (exact date not published)", "zh": "2023 年 11 月至 2024 年 3 月之间（确切日期未公布）"}, "title": {"en": "Gropius Bau podcast “Beyond and Within: AI Talks”, Ep. 3 “AI All Around Us”", "zh": "Gropius Bau 播客「Beyond and Within: AI Talks」第 3 集《我们身边的 AI》"}, "summary": {"en": "K and Robert Maharajh, hosted by Eliane Eid, talk about K's journal essays and the high-dimensional spaces of neural networks. A transcript is linked from the page.", "zh": "K 与 Robert Maharajh 对谈，由 Eliane Eid 主持，讨论 K 的系列文章和神经网络的高维空间。页面上附有文字稿。"}, "url": "https://www.berlinerfestspiele.de/en/gropius-bau/programm/2023/ausstellungen/kuenstliche-intelligenz  "url": "https://x.com/kalladomcdowell/status/1707451755964072273", "source": {"en": "X (@kalladomcdowell)", "zh": "X（@kalladomcdowell）"}, "links": [{"url": "https://x.com/gropiusbau/status/1707429385303892475", "label": {"en": "Gropius Bau's post about the essay", "zh": "Gropius Bau 关于该文的推文"}}]}, {"id": "2023-09-designing-neural-media", "date": "2023-09-28", "types": ["essay"], "added": "2026-10-21", "date_display": {"en": "28 Sep 2023", "zh": "2023 年 9 月 28 日"}, "title": {"en": "“Designing Neural Media”", "zh": "《设计神经媒体》"}, "summary": {"en": "First essay in K's three-part series as Gropius Bau Writer in Residence, and where the term was first set out: how neural networks work and how their design shapes subjectivity.", "zh": "K 担任格罗皮乌斯展览馆驻馆作家期间三篇系列文章中的第一篇，也是这一术语最早被系统提出的地方。文章讲解神经网络如何运作，以及其设计如何塑造主体性。"}, "url": "https://www.berlinerfestspiele.de/en/gropius-bau/programm/journal/2023/k-allado-mcdowell-designing-neural-media", "source": {"en": "Gropius Bau Journal", "zh": "格罗皮乌斯展览馆 Journal"}, "links": [{"url": "https://www.berlinerfestspiele.de/gropius-bau/programm/journal/2023/k-allado-mcdowell-designing-neural-media", "label": {"en": "German version", "zh": "德文版"}}, {"url": "https://www.e-flux.com/announcements/552015/programme-on-artificial-intelligence", "label": {"en": "e-flux announcement of the Gropius Bau AI programme", "zh": "e-flux 上的 Gropius Bau 人工智能项目公告"}}]}, {"id": "2023-09-28-holo", "date": "2023-09-28", "types": ["post"], "added": "2026-10-21", "date_display": {"en": "28 Sep 2023", "zh": "2023 年 9 月 28 日"}, "title": {"en": "HOLO: “K Allado McDowell Contemplates Neural Media”", "zh": "HOLO：《K Allado McDowell 思考神经媒体》"}, "summary": {"en": "A short HOLO note on the new essay, quoting: “When we interact with neural media, we interact with an entire network at once.”", "zh": "HOLO 对这篇新文章的简短介绍，引用了文中的一句话：「当我们与神经媒体互动时，我们是在同时与整个网络互动。」"}, "url": "https://www.holo.mg/stream/gropius-bau-berlin-k-allado-mcdowell-neural-media/", "source": {"en": "HOLO", "zh": "HOLO"}}, {"id": "2022-10-25-song-of-the-ambassadors", "date": "2022-10-25", "types": ["performance"], "added": "2026-10-25", "date_display": {"en": "25 Oct 2022", "zh": "2022 年 10 月 25 日"}, "title": {"en": "K Allado-McDowell, Song of the Ambassadors: an AI opera and neuroscience study, Lincoln Center", "zh": "K Allado-McDowell《大使之歌》：一部 AI 歌剧，也是一项神经科学实验（纽约林肯中心）"}, "summary": {"en": "Work-in-progress preview at Alice Tully Hall. Libretto written by K with GPT-3, music by Derrick Skye. An EEG cap worn by Lincoln Center’s Shanta Thake fed her brainwaves into Refik Anadol’s AI-generated projections, while UCSD scientists recorded audience brainwaves and heart rate. At the start of the 2025 Long Now talk on neural media, K recalls an opera that was also a neuroscience study, “using brain waves to control AI-generated visuals”; the description matches this project.", "zh": "在爱丽丝·塔利音乐厅进行的创作中预演。剧本由 K 与 GPT-3 合写，音乐由 Derrick Skye 创作。林肯中心首席艺术官 Shanta Thake 佩戴脑电帽，她的脑电波实时输入 Refik Anadol 的 AI 生成影像；加州大学圣地亚哥分校的科学家同时记录观众的脑电波和心率。K 在 2025 年 Long Now 神经媒体演讲的开头，回忆起一部同时也是神经科学实验、「用脑电波控制 AI 生成影像」的歌剧，描述与这个项目一致。"}, "url": "https://www.kalladomcdowell.com/songoftheambassadors", "source": {"en": "kalladomcdowell.com · BOMB", "zh": "kalladomcdowell.com · BOMB 杂志"}, "links": [{"url": "https://bombmagazine.org/articles/2022/10/25/k-allado-mcdowell-derrick-skye-and-refik-anadol-in-conversation/", "label": {"en": "BOMB: K, Derrick Skye & Refik Anadol in conversation", "zh": "BOMB 杂志：K、Derrick Skye 与 Refik Anadol 对谈"}}]}, {"id": "2021-03-choi-dipaola-neural-media", "date": "2021-03-01", "types": ["essay", "context"], "added": "2026-10-25", "date_display": {"en": "2021 (follow-ups 2023)", "zh": "2021 年（后续论文 2023 年）"}, "title": {"en": "Suk Kyoung Choi & Steve DiPaola (Simon Fraser University): an independent coinage of “neural media”", "zh": "Suk Kyoung Choi 与 Steve DiPaola（西蒙菲莎大学）：独立提出的「神经媒体」概念"}, "summary": {"en": "In “Artistic Style Meets Artificial Intelligence” (Journal of Perceptual Imaging, 2021, with Hannu Töyrylä) they propose a post-phenomenology of “neural media”, meaning artistic practice with deep neural networks that unsettles intention and authorship. They continued the idea in 2023 papers on generative AI as an “other” and on journeys through latent space. Wider context: a separate, earlier use of the term about artists’ process, not K’s media-eras framework.", "zh": "他们在《Artistic Style Meets Artificial Intelligence》（《Journal of Perceptual Imaging》，2021 年，与 Hannu Töyrylä 合著）中提出「神经媒体」的后现象学：指借助深度神经网络进行的艺术实践，这种实践会动摇创作意图与作者身份。2023 年他们又发表论文，延续讨论把生成式 AI 视为「他者」以及在潜在空间中的创作旅程。（相关背景：这是更早、独立的术语用法，关注艺术家的创作过程，而非 K 的媒介时代框架。）"}, "url": "https://doi.org/10.2352/J.Percept.Imaging.2021.4.2.020501", "source": {"en": "Journal of Perceptual Imaging (IS&T)", "zh": "《Journal of Perceptual Imaging》（IS&T）"}, "links": [{"url": "https://computationalcreativity.net/iccc23/papers/ICCC-2023_paper_109.pdf", "label": {"en": "ICCC 2023 paper", "zh": "ICCC 2023 论文"}}, {"url": "https://doi.org/10.1145/3610661.3616125", "label": {"en": "ACM 2023 paper", "zh": "ACM 2023 论文"}}]}], "reading": ["2023-09-designing-neural-media", "2024-neural-interpellation", "2025-02-19-am-i-slop", "2025-04-11-longnow-video"], "pages": [{"key": "home", "file": "index.html", "label": {"en": "Neural Media", "zh": "神经媒体总览"}}, {"key": "who-else", "file": "who-else.html", "label": {"en": "Who else", "zh": "其他研究者"}}, {"key": "bci", "file": "bci.html", "label": {"en": "BCI × Neural Media", "zh": "脑机接口与神经媒体"}}, {"key": "new-models", "file": "new-models.html", "label": {"en": "New Models", "zh": "New Models 与 Lil Internet"}}, {"key": "felstead-leung", "file": "felstead-leung.html", "label": {"en": "Felstead & Leung", "zh": "Felstead 与 Leung"}}]};</script>

      list.map(function (v) { return yt(v.url, list.length > 1 || v.force ? v.label : null); }).join("") + '</div>';

  function pickLatest(entries, asOfIso, days, minN, maxN) {
    days = days || 30; minN = minN || 6; maxN = maxN || 10;
    var asOf = Date.parse(asOfIso || "") || Date.now();
    var cut = asOf - days * 864e5;
    var sorted = (entries || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    var recent = sorted.filter(function (e) { return Date.parse(e.date) >= cut; });
    var list = recent.length >= minN ? recent : sorted.slice(0, Math.max(minN, recent.length));
    return list.slice(0, maxN);
  }

        '<div class="land-group" id="theory"><div class="land-head"><span class="roman">II</span><h3>' + bi(B.theory.title) + '</h3></div>' +
          '<ul class="who-list ideas">' + theory + '</ul>' +
          (B.note ? '<div class="land-note">' + bi(B.note, "p") + '</div>' : "") + '</div>' +
        '<div class="land-group" id="news"><div class="land-head"><span class="roman">III</span><h3>' + bi(B.news.title) + '</h3></div>' +
          '<ol class="bnews">' + newsHtml + '</ol></div>';
    }


    // Archive pages (New Models; Felstead & Leung): overview, ideas, K link, full archive with filters
    if (D.newmodels && document.getElementById("newmodels")) archive(D.newmodels, "newmodels", {
      num: "07", pre: "nm",
      about: { en: "Who they are", zh: "他们是谁" }, evo: { en: "How the platform evolved", zh: "平台的演变" },
      all: { en: "Every episode & post, newest first", zh: "全部节目与文章（从新到旧）" }, fmt: { en: "Filter by series", zh: "按栏目筛选" } });
    if (D.felsteadleung && document.getElementById("felsteadleung")) archive(D.felsteadleung, "felsteadleung", {
      num: "08", pre: "fl",
      about: { en: "Who they are", zh: "他们是谁" }, evo: { en: "How their work developed", zh: "工作的发展脉络" },
      all: { en: "Every work, talk & text, newest first", zh: "全部作品、演讲与文字（从新到旧）" }, fmt: { en: "Filter by format", zh: "按形式筛选" } });

    function archive(N, hostId, o) {
      var P = o.pre;
      var nmTag = function (cls, x) { return '<span class="ntag ' + cls + '">' + bi(x) + '</span>'; };
      var badge = '<span class="nm-badge">' + bi({ en: "Neural media / future media", zh: "神经媒体 / 未来新媒体" }) + '</span>';
      var people = N.people.map(function (pp) {
        return '<article class="nm-person"><h4>' + esc(pp.name) + '</h4><div class="nm-role">' + bi(pp.role) + '</div>' +
          '<div class="ptext">' + bi(pp.text, "p") + '</div>' +
          (pp.links && pp.links.length ? '<div class="links">' + pp.links.map(function (l) { return ext(l.url, bi(l.label) + " ↗"); }).join("") + '</div>' : "") + '</article>';
      }).join("");
      var evo = N.evolution.map(function (ev) {
        return '<li><span class="evy">' + esc(ev.year) + '</span><div class="evt">' + bi(ev.text, "p") + '</div></li>';
      }).join("");
      var ideas = N.ideas.map(function (it, ii) {
        return '<article class="nm-idea' + (it.nm ? " flag" : "") + '"><span class="pnum">' + (ii + 1 < 10 ? "0" : "") + (ii + 1) + '</span>' +
          (it.nm ? badge : "") + '<h4>' + bi(it.term) + '</h4><div class="ptext">' + bi(it.text, "p") + '</div>' +
          (it.where ? '<div class="idea-src">' + bi(it.where) + '</div>' : "") + '</article>';
      }).join("");
      var rel = function (arr) {
        return arr.map(function (r) {
          return '<li>' + (r.when ? '<span class="rwhen">' + bi(r.when) + '</span>' : "") + '<div class="who-line">' + bi(r.text, "p") + '</div>' +
            (r.url ? '<div class="links">' + ext(r.url, bi({ en: "Source ↗", zh: "来源 ↗" })) + (r.internal ? intl(r.internal, bi({ en: "Entry below", zh: "见下方条目" }) + " ↓", "internal") : "") + '</div>' : "") + '</li>';
        }).join("");
      };
      var E = N.entries, W = N.who || null;
      var nFlag = E.filter(function (e) { return e.nm; }).length;
      var fmtCount = {}; E.forEach(function (e) { fmtCount[e.fmt] = (fmtCount[e.fmt] || 0) + 1; });
      var whoCount = {}; E.forEach(function (e) { if (e.who) whoCount[e.who] = (whoCount[e.who] || 0) + 1; });
      var chips = '<button class="chip" type="button" data-f="all" aria-pressed="true">' + bi({ en: "All", zh: "全部" }) + '<b>' + E.length + '</b></button>' +
        '<button class="chip chip-nm" type="button" data-f="nm" aria-pressed="false">' + bi({ en: "Neural media / future media only", zh: "只看神经媒体 / 未来新媒体" }) + '<b>' + nFlag + '</b></button>' +
        (W ? Object.keys(W).filter(function (k) { return whoCount[k]; }).map(function (k) {
          return '<button class="chip chip-who" type="button" data-f="w:' + k + '" aria-pressed="false">' + bi(W[k]) + '<b>' + whoCount[k] + '</b></button>';
        }).join("") : "");
      var fchips = Object.keys(N.formats).filter(function (k) { return fmtCount[k]; }).map(function (k) {
        return '<button class="chip" type="button" data-f="f:' + k + '" aria-pressed="false">' + bi(N.formats[k]) + '<b>' + fmtCount[k] + '</b></button>';
      }).join("");
      var lastY = "", list = E.map(function (e) {
        var y = e.date.slice(0, 4), yr = "";
        if (y !== lastY) {
          var cnt = E.filter(function (x) { return x.date.slice(0, 4) === y; }).length;
          yr = '<li class="nyear nm-year" id="y' + y + '" data-year="' + y + '"><span>' + y + '</span><em>' + bi({ en: cnt + " entries", zh: cnt + " 条" }) + '</em></li>';
          lastY = y;
        }
        var dd = e.date_display || fmtStamp(e.date);
        var featBadge = e.featured ? '<a class="nm-feat-badge" href="' + esc(e.featured) + '" data-internal="">' + bi({ en: "See featured series ↑", zh: "见精选系列 ↑" }) + '</a>' : "";
        var meta = (W && e.who ? nmTag("w-" + esc(e.who), W[e.who]) : "") + nmTag("f-" + esc(e.fmt), N.formats[e.fmt]) + nmTag("a-" + esc(e.access), N.access[e.access]) + nmTag("b-" + esc(e.basis), N.basis[e.basis]) +
          (e.mins ? '<span class="ntag mins">' + esc(e.mins) + ' min</span>' : "") + (e.nm ? badge : "") + featBadge;
        var coverBlock = e.cover ? filmCover(e.url, e.cover, e.fmt === "film" ? { en: "Watch ↗", zh: "观看 ↗" } : null, "in-archive") : "";
        return yr + '<li class="nitem nm-entry' + (e.nm ? " flag" : "") + (e.cover ? " has-cover" : "") + '" id="e-' + esc(e.id) + '" data-year="' + y + '" data-fmt="' + esc(e.fmt) + '" data-who="' + esc(e.who || "") + '" data-nm="' + (e.nm ? "1" : "0") + '">' +
          '<div class="ndate"><time datetime="' + esc(e.date) + '">' + bi(dd) + '</time></div>' +
          '<div class="nbody"><div class="who-marks">' + meta + '</div>' +
          '<h4>' + ext(e.url, bi(e.title)) + '</h4>' +
          (e.people ? '<div class="nm-people">' + (/; hosts$/.test(e.people) ? bi({ en: e.people.replace(/; hosts$/, " · with the hosts"), zh: e.people.replace(/; hosts$/, " · 与主持人") }) : esc(e.people)) + '</div>' : "") +
          coverBlock +
          '<div class="who-line nm-sum">' + bi(e.summary, "p") + '</div>' +
          (e.nm ? '<div class="nm-note"><span class="nm-note-h">' + bi({ en: "On neural / future media", zh: "关于神经媒体 / 未来新媒体" }) + '</span>' + bi(e.nm, "p") + '</div>' : "") +
          ytRow(ytList(e.url, e.title, e.links)) +
          '<div class="links">' + ext(e.url, bi({ en: "Open source ↗", zh: "查看原文 ↗" })) +
            (e.links || []).map(function (l) { return ext(l.url, bi(l.label) + " ↗"); }).join("") +
            (e.internal || []).map(function (l) { return intl(l.href, bi(l.label) + " →", "internal"); }).join("") + '</div>' +
          '</div></li>';
      }).join("");
      var R = N.relation;
      var S = N.series || null;
      var seriesHtml = "";
      if (S) {
        var films = (S.films || []).map(function (f, fi) {
          var watch = f.watch || { en: "Watch ↗", zh: "观看 ↗" };
          var ytMir = f.youtube ? yt(f.youtube, { en: "YouTube mirror", zh: "YouTube 镜像" }, { cls: "in-series" }) : "";
          return '<article class="janky-film" id="janky-' + esc(f.entry) + '">' +
            filmCover(f.url, f.cover, watch, "hero") +
            '<div class="janky-body">' +
              '<div class="janky-ep">' + bi(f.ep) + (f.mins ? '<span class="ntag mins">' + esc(f.mins) + ' min</span>' : "") +
                (f.nm ? badge : "") + '</div>' +
              '<h4>' + ext(f.url, bi(f.title)) + '</h4>' +
              (f.credits ? '<div class="janky-credits">' + bi(f.credits) + '</div>' : "") +
              '<div class="who-line">' + bi(f.summary, "p") + '</div>' +
              (f.nm ? '<div class="nm-note"><span class="nm-note-h">' + bi({ en: "On neural / future media", zh: "关于神经媒体 / 未来新媒体" }) + '</span>' + bi(f.nm, "p") + '</div>' : "") +
              ytMir +
              '<div class="links">' + ext(f.url, bi(watch)) +
                (f.alt_url ? ext(f.alt_url, bi({ en: "Series page on DIS ↗", zh: "DIS 系列页 ↗" })) : "") +
                intl("#e-" + f.entry, bi({ en: "Archive entry ↓", zh: "档案条目 ↓" }), "internal") +
              '</div></div></article>';
        }).join("");
        seriesHtml =
          '<div class="land-group janky-series" id="' + P + '-janky"><div class="land-head"><span class="roman">IV</span><h3>' + bi(S.title) + '</h3></div>' +
            (S.kicker ? '<p class="janky-kicker">' + bi(S.kicker) + '</p>' : "") +
            '<div class="janky-intro">' +
              (S.cover ? '<a class="janky-series-cover" href="' + esc(S.url) + '" target="_blank" rel="noopener noreferrer"><img loading="lazy" decoding="async" alt="" src="' + esc(S.cover) + '"></a>' : "") +
              '<div class="janky-intro-text">' + bi(S.intro, "p") +
                '<div class="links">' + ext(S.url, bi({ en: "I'm So Janky on DIS ↗", zh: "DIS 上的「I'm So Janky」↗" })) + '</div></div></div>' +
            '<div class="janky-films">' + films + '</div></div>';
      }
      var archRoman = S ? "V" : "IV";
      var asOfA = (typeof D !== "undefined" && D.meta && D.meta.last_updated) || (E[0] && E[0].date);
      var latestItems = pickLatest(E, asOfA, 30, 6, 8).map(function (e) {
        var dd = e.date_display || fmtStamp(e.date);
        var meta = (W && e.who ? nmTag("w-" + esc(e.who), W[e.who]) : "") + nmTag("f-" + esc(e.fmt), N.formats[e.fmt]) +
          (e.mins ? '<span class="ntag mins">' + esc(e.mins) + ' min</span>' : "") + (e.nm ? badge : "");
        return { date: e.date, date_display: dd, title: e.title, url: e.url, summary: e.summary, meta: meta,
          href: "#e-" + e.id, fresh: (Date.parse(asOfA) - Date.parse(e.date)) / 864e5 <= 30 };
      });
      var host = document.getElementById(hostId);
      host.innerHTML =
        '<div class="sec-head"><span class="num">' + o.num + '</span><h2>' + bi(N.title) + '</h2></div>' +
        '<div class="lead nm-lead">' + bi(N.lead, "p") + '</div>' + stamp + '<div style="height:24px"></div>' +
        latestSection({ id: P + "-latest", items: latestItems, note: o.latestNote || { en: "Newest entries (last ~30 days, or the newest six). Full archive with filters further down.", zh: "最新条目（约最近 30 天；不足则取最新六条）。带筛选的完整档案在更下方。" } }) +
        '<div class="land-group" id="' + P + '-about"><div class="land-head"><span class="roman">I</span><h3>' + bi(o.about) + '</h3></div>' +
          '<div class="nm-people-grid">' + people + '</div>' +
          '<h5 class="nm-sub">' + bi(o.evo) + '</h5><ol class="nm-evo">' + evo + '</ol></div>' +
        '<div class="land-group" id="' + P + '-ideas"><div class="land-head"><span class="roman">II</span><h3>' + bi({ en: "Core recurring ideas, in plain language", zh: "反复出现的核心观点（白话版）" }) + '</h3></div>' +
          '<div class="nm-ideas">' + ideas + '</div></div>' +
        '<div class="land-group" id="' + P + '-k"><div class="land-head"><span class="roman">III</span><h3>' + bi({ en: "Relationship to K & neural media", zh: "与 K 及「神经媒体」的关系" }) + '</h3></div>' +
          '<div class="nm-relsum">' + bi(R.summary, "p") + '</div>' +
          '<div class="nm-rel"><section><h5 class="nm-sub">' + bi({ en: "Direct links (sourced)", zh: "直接联系（有出处）" }) + '</h5><ul class="nm-rlist">' + rel(R.direct) + '</ul></section>' +
          '<section><h5 class="nm-sub">' + bi({ en: "Thematic overlap & differences", zh: "主题重叠与差异" }) + '</h5><ul class="nm-rlist">' + rel(R.thematic) + '</ul></section></div></div>' +
        seriesHtml +
        '<div class="land-group" id="' + P + '-archive"><div class="land-head"><span class="roman">' + archRoman + '</span><h3>' + bi(o.all) + '</h3></div>' +
          '<div class="feed-note">' + bi(N.note, "p") + '</div>' +
          '<div class="legend nm-legend">' + Object.keys(N.basis).map(function (k) { return nmTag("b-" + k, N.basis[k]); }).join("") + '</div>' +
          '<div class="filters nm-filters" role="group" aria-label="Filter · 筛选">' + chips + '</div>' +
          '<details class="nm-fmt"><summary>' + bi(o.fmt) + '</summary><div class="filters">' + fchips + '</div></details>' +
          '<div class="nm-shown" aria-live="polite"></div>' +
          '<ol class="bnews nm-list">' + list + '</ol></div>';
      var shown = host.querySelector(".nm-shown");
      var applyF = function (f) {
        var n = 0;
        host.querySelectorAll(".nm-entry").forEach(function (li) {
          var ok = f === "all" || (f === "nm" && li.getAttribute("data-nm") === "1") ||
            (f.indexOf("f:") === 0 && li.getAttribute("data-fmt") === f.slice(2)) ||
            (f.indexOf("w:") === 0 && li.getAttribute("data-who") === f.slice(2));
          li.hidden = !ok; if (ok) n++;
        });
        host.querySelectorAll(".nm-year").forEach(function (yh) {
          var y = yh.getAttribute("data-year");
          var c = host.querySelectorAll('.nm-entry[data-year="' + y + '"]:not([hidden])').length;
          yh.hidden = !c;
          yh.querySelector("em").innerHTML = bi({ en: c + " entries", zh: c + " 条" });
        });
        shown.innerHTML = f === "all" ? "" : bi({ en: "Showing " + n + " of " + E.length + " entries", zh: "显示 " + n + " / " + E.length + " 条" });
        host.querySelectorAll(".nm-filters .chip, .nm-fmt .chip").forEach(function (x) { x.setAttribute("aria-pressed", String(x.getAttribute("data-f") === f)); });
      };
      host.addEventListener("click", function (ev) {
        var b = ev.target.closest(".nm-filters .chip, .nm-fmt .chip"); if (!b) return;
        applyF(b.getAttribute("data-f"));
      });
      // Year links in the sticky bar (and in-page links to entries): if a filter hides the target, reset to "All" first.
      document.querySelectorAll('.subnav a[href^="#y"], a[href^="#e-"]').forEach(function (a) {
        a.addEventListener("click", function () {
          var t = document.getElementById(a.getAttribute("href").slice(1));
          if (t && t.hidden) applyF("all");
        });
      });
    }

    document.getElementById("foot").innerHTML =
      bi({ en: "An independent bilingual tracker of public sources on Neural Media, a concept by K Allado-McDowell. Every item links to its original source. Dates are China time (UTC+8).",
           zh: "这是一个独立的双语追踪站，收录有关 K Allado-McDowell「神经媒体」概念的公开资料。每一条目都附有原始来源链接。日期均为北京时间（UTC+8）。" }, "p");
  }

  // Language toggle
  function setLang(l) {
    document.body.className = "lang-" + l;
    document.documentElement.lang = l === "zh" ? "zh-Hans" : "en";
    document.querySelectorAll(".lang button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === l)); });
    try { localStorage.setItem("nm-lang", l); } catch (e) {}
    // carry the language choice across pages (also works when localStorage is unavailable)
    document.querySelectorAll("a[data-internal]").forEach(function (a) {
      var h = a.getAttribute("href"), hash = "", k = h.indexOf("#");
      if (k > -1) { hash = h.slice(k); h = h.slice(0, k); }
      if (!h) return;
      h = h.replace(/[?&]lang=(en|zh|both)/, "");
      a.setAttribute("href", h + "?lang=" + l + hash);
    });
  }
  document.querySelector(".lang").addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (b) setLang(b.getAttribute("data-lang"));
  });
  if (window.__NM_DATA__) render(window.__NM_DATA__);
  var saved = null; try { saved = localStorage.getItem("nm-lang"); } catch (e) {}
  var q = (location.search.match(/[?&]lang=(en|zh|both)/) || [])[1];
  setLang(q || saved || "both");

  // Sticky header height -> scroll offset, so headings are never hidden under the header + section bar.
  var topbar = document.querySelector(".topbar");
  function syncOffset() {
    var hgt = topbar ? Math.ceil(topbar.getBoundingClientRect().height) : 60;
    document.documentElement.style.setProperty("--hdr", hgt + "px");
    return hgt;
  }
  syncOffset();
  window.addEventListener("resize", syncOffset);

  // Scroll-spy: highlight the section currently in view in the in-page bar.
  var spyLinks = Array.prototype.slice.call(document.querySelectorAll(".subnav a[data-spy]"));
  var spyTargets = spyLinks.map(function (a) { return document.getElementById(a.getAttribute("data-spy")); });
  var current = null;
  function spy() {
    if (!spyLinks.length) return;
    var line = syncOffset() + 24, idx = -1;
    spyTargets.forEach(function (el, i) { if (el && el.getBoundingClientRect().top <= line) idx = i; });
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) idx = spyTargets.length - 1;
    var a = idx > -1 ? spyLinks[idx] : null;
    if (a === current) return;
    current = a;
    spyLinks.forEach(function (l) { if (l === a) l.setAttribute("aria-current", "true"); else l.removeAttribute("aria-current"); });
    if (a) {  // keep the active link visible in the horizontally scrolling bar on small screens
      var bar = a.parentNode, r = a.getBoundingClientRect(), br = bar.getBoundingClientRect();
      if (r.left < br.left || r.right > br.right) bar.scrollLeft += (r.left - br.left) - (br.width - r.width) / 2;
    }
  }
  var ticking = false;
  window.addEventListener("scroll", function () {
    if (!ticking) { ticking = true; requestAnimationFrame(function () { ticking = false; spy(); }); }
  }, { passive: true });
  spy();

  // On narrow screens the page nav scrolls sideways: keep the current page's tab in view.
  var curNav = document.querySelector('.nav a[aria-current="page"]');
  function navToCur() {
    if (!curNav) return;
    var navEl = curNav.closest(".nav") || curNav.parentNode;
    if (navEl.scrollWidth <= navEl.clientWidth + 1) return;
    if (!curNav.nextElementSibling) { navEl.scrollLeft = navEl.scrollWidth; return; }
    var nr = navEl.getBoundingClientRect(), cr = curNav.getBoundingClientRect();
    if (cr.right > nr.right - 4 || cr.left < nr.left) navEl.scrollLeft += (cr.right - nr.right) + 16;
  }
  navToCur(); window.addEventListener("load", navToCur);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(navToCur);

  if (location.hash) { var tgt = document.getElementById(location.hash.slice(1)); if (tgt) setTimeout(function () { tgt.scrollIntoView(); spy(); }, 0); }
})();
</script>
