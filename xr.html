        return '<tr><th scope="row">' + bi(row.term) + '</th><td>' + bi(row.means, "p") + '</td><td>' + bi(row.not, "p") + '</td></tr>';
      }).join("");
      var srcs = (T.sources || []).map(function (s) { return ext(s.url, bi(s.label) + " ↗"); }).join("");
      var feat = byX[X.featured];
      var featHtml = "";
      if (feat) {
        featHtml = '<div class="land-group" id="xr-feature"><div class="land-head"><span class="roman">★</span><h3>' +
          bi({ en: "Glasses-form VR", zh: "眼镜形态的 VR" }) + '</h3></div>' +
          '<p class="xr-kicker">' + bi({
            en: "The virtual environment is the primary space. The computer sits in a puck. This is not the AI-glasses product line, and it is not a choice between AI glasses and VR.",
            zh: "虚拟环境是主要空间，计算机在计算盒里。这不是 AI 眼镜那条产品线，也不是「AI 眼镜还是 VR」的二选一。"
          }) + '</p>' +
          xcard(feat, { anchor: "xr-feature-card", player: true, extraLinks: intl("#e-" + feat.id, bi({ en: "Log entry ↓", zh: "日志条目 ↓" }), "internal") }) +
          '</div>';
      }
      var chips = '<button class="chip" type="button" data-f="all" aria-pressed="true">' + bi({ en: "All", zh: "全部" }) + '<b>' + X.entries.length + '</b></button>' +
        Object.keys(X.categories).filter(function (k) {
          return X.entries.some(function (e) { return (e.tags || []).indexOf(k) !== -1; });
        }).map(function (k) {
          var n = X.entries.filter(function (e) { return (e.tags || []).indexOf(k) !== -1; }).length;
          return '<button class="chip" type="button" data-f="' + esc(k) + '" aria-pressed="false">' + bi(X.categories[k]) + '<b>' + n + '</b></button>';
        }).join("");
      var log = X.entries.map(function (e) { return xcard(e, { player: !!e.youtube }); }).join("");
      var B = X.beside;
      var besideLinks = (B.links || []).map(function (l) {
        var inner = bi(l.label) + (l.url ? " ↗" : " →");
        return l.url ? ext(l.url, inner) : intl(l.href, inner, "internal");
      }).join("");
      var host = document.getElementById("xr");
      host.innerHTML =
        '<div class="sec-head"><span class="num">09</span><h2>' + bi(X.title) + '</h2></div>' +
        '<div class="lead">' + bi(X.lead, "p") + '</div>' + stamp +
        '<div class="land-group latest-block" id="xr-latest">' +
          '<div class="sec-head latest-head"><span class="num">★</span><h2>' + bi({ en: "Latest updates", zh: "最新动态" }) + '</h2></div>' +
          '<div class="feed-note">' + bi(X.note, "p") + '</div>' +
          '<div class="xr-list">' + latestHtml + '</div></div>' +
        '<div class="land-group" id="xr-taxonomy"><div class="land-head"><span class="roman">I</span><h3>' + bi(T.title) + '</h3></div>' +
          '<div class="lead">' + bi(T.lead, "p") + '</div>' +
          '<div class="xr-map"><div class="xr-umbrella">' + bi(Map.umbrella) + '</div>' +
            '<div class="xr-map-label">' + bi(Map.family_label) + '</div><div class="xr-family">' + family + '</div>' +
            '<p class="xr-kicker">' + bi(Map.aside) + '</p>' +
            '<div class="xr-map-label">' + bi(Map.products_label) + '</div><div class="xr-products">' + products + '</div></div>' +
          '<div class="xr-table-wrap"><table class="xr-table"><thead><tr><th>' + bi(Col.term) + '</th><th>' + bi(Col.means) + '</th><th>' + bi(Col.not) + '</th></tr></thead><tbody>' +
            tableRows + '</tbody></table></div>' +
          '<div class="links">' + srcs + '</div></div>' +
        featHtml +
        '<div class="land-group" id="xr-log"><div class="land-head"><span class="roman">II</span><h3>' + bi({ en: "Full log, newest first", zh: "全部动态（从新到旧）" }) + '</h3></div>' +
          '<div class="filters xr-filters" role="group" aria-label="Filter by tag">' + chips + '</div>' +
          '<div class="xr-shown" aria-live="polite"></div>' +
          '<div class="xr-list">' + log + '</div></div>' +
        '<div class="land-group" id="xr-beside"><div class="land-head"><span class="roman">III</span><h3>' + bi(B.title) + '</h3></div>' +
          '<div class="who-line">' + bi(B.text, "p") + '</div>' +
          '<div class="links">' + besideLinks + '</div></div>';
      var shown = host.querySelector(".xr-shown");
      var applyX = function (f) {
        var n = 0;
        host.querySelectorAll("#xr-log .xr-card").forEach(function (el) {
          var ok = f === "all" || (" " + el.getAttribute("data-tags") + " ").indexOf(" " + f + " ") !== -1;
          el.hidden = !ok;
          if (ok) n++;
        });
        shown.innerHTML = f === "all" ? "" : bi({ en: "Showing " + n + " of " + X.entries.length, zh: "显示 " + n + " / " + X.entries.length + " 条" });
        host.querySelectorAll(".xr-filters .chip").forEach(function (b) {
          b.setAttribute("aria-pressed", String(b.getAttribute("data-f") === f));
        });
      };
      host.querySelector(".xr-filters").addEventListener("click", function (ev) {
        var b = ev.target.closest(".chip");
        if (!b) return;
        applyX(b.getAttribute("data-f"));
      });
    }

    document.getElementById("foot").innerHTML =
      bi({ en: "An independent bilingual tracker of public sources on Neural Media, a concept by K Allado-McDowell. Every item links to its original source. Dates are China time (UTC+8).",
           zh: "这是一个独立的双语追踪站，收录有关 K Allado-McDowell「神经媒体」概念的公开资料。每一条目都附有原始来源链接。日期均为北京时间（UTC+8）。" }, "p");
  }

  // Language toggle
  function setLang(l) {
    document.body.className = "lang-" + l;
    document.documentElement.lang = l === "zh" ? "zh-Hans" : "en";
    document.querySelectorAll(".lang button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === l)); });
    try { localStorage.setItem("nm-lang", l); } catch (e) {}
    // carry the language choice across pages (also works when localStorage is unavailable)
    document.querySelectorAll("a[data-internal]").forEach(function (a) {
      var h = a.getAttribute("href"), hash = "", k = h.indexOf("#");
      if (k > -1) { hash = h.slice(k); h = h.slice(0, k); }
      if (!h) return;
      h = h.replace(/[?&]lang=(en|zh|both)/, "");
      a.setAttribute("href", h + "?lang=" + l + hash);
    });
  }
  document.querySelector(".lang").addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (b) setLang(b.getAttribute("data-lang"));
  });
  if (window.__NM_DATA__) render(window.__NM_DATA__);
  var saved = null; try { saved = localStorage.getItem("nm-lang"); } catch (e) {}
  var q = (location.search.match(/[?&]lang=(en|zh|both)/) || [])[1];
  setLang(q || saved || "both");

  // Sticky header height -> scroll offset, so headings are never hidden under the header + section bar.
  var topbar = document.querySelector(".topbar");
  function syncOffset() {
    var hgt = topbar ? Math.ceil(topbar.getBoundingClientRect().height) : 60;
    document.documentElement.style.setProperty("--hdr", hgt + "px");
    return hgt;
  }
  syncOffset();
  window.addEventListener("resize", syncOffset);

  // Scroll-spy: highlight the section currently in view in the in-page bar.
  var spyLinks = Array.prototype.slice.call(document.querySelectorAll(".subnav a[data-spy]"));
  var spyTargets = spyLinks.map(function (a) { return document.getElementById(a.getAttribute("data-spy")); });
  var current = null;
  function spy() {
    if (!spyLinks.length) return;
    var line = syncOffset() + 24, idx = -1;
    spyTargets.forEach(function (el, i) { if (el && el.getBoundingClientRect().top <= line) idx = i; });
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) idx = spyTargets.length - 1;
    var a = idx > -1 ? spyLinks[idx] : null;
    if (a === current) return;
    current = a;
    spyLinks.forEach(function (l) { if (l === a) l.setAttribute("aria-current", "true"); else l.removeAttribute("aria-current"); });
    if (a) {  // keep the active link visible in the horizontally scrolling bar on small screens
      var bar = a.parentNode, r = a.getBoundingClientRect(), br = bar.getBoundingClientRect();
      if (r.left < br.left || r.right > br.right) bar.scrollLeft += (r.left - br.left) - (br.width - r.width) / 2;
    }
  }
  var ticking = false;
  window.addEventListener("scroll", function () {
    if (!ticking) { ticking = true; requestAnimationFrame(function () { ticking = false; spy(); }); }
  }, { passive: true });
  spy();

  // On narrow screens the page nav scrolls sideways: keep the current page's tab in view.
  var curNav = document.querySelector('.nav a[aria-current="page"]');
  function navToCur() {
    if (!curNav) return;
    var navEl = curNav.closest(".nav") || curNav.parentNode;
    if (navEl.scrollWidth <= navEl.clientWidth + 1) return;
    if (!curNav.nextElementSibling) { navEl.scrollLeft = navEl.scrollWidth; return; }
    var nr = navEl.getBoundingClientRect(), cr = curNav.getBoundingClientRect();
    if (cr.right > nr.right - 4 || cr.left < nr.left) navEl.scrollLeft += (cr.right - nr.right) + 16;
  }
  navToCur(); window.addEventListener("load", navToCur);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(navToCur);

  if (location.hash) { var tgt = document.getElementById(location.hash.slice(1)); if (tgt) setTimeout(function () { tgt.scrollIntoView(); spy(); }, 0); }
})();
</script>
</body>
</html>
