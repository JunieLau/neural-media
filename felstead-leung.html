odels 称「今年秋天」）"}}, {"id": "hervisions-living-neural-cultures", "date": "2025-08-30", "who": "leung", "fmt": "interview", "basis": "listing", "access": "paid", "url": "https://www.hervisions.world/portal/assembloid-agency-interview", "title": {"en": "HERVISIONS interview: “Designing with Living Neural Cultures”", "zh": "HERVISIONS 访谈：「用活体神经培养物做设计」"}, "summary": {"en": "A HERVISIONS interview titled “Designing with Living Neural Cultures”, listed on Leung's site. Behind a members' portal; not read. Date inferred from page metadata (late Aug 2025).", "zh": "伦敦的新媒体艺术平台 HERVISIONS 发表的访谈「Designing with Living Neural Cultures」，标题出现在 Leung 的网站上，Chloe Loewith 的简介里也提到在 HERVISIONS 发表过文章。原文在会员门户后面，我们没能读到，日期是按网页元数据推断的 2025 年 8 月底，可能不准。"}, "people": "Jenn Leung", "nm": {"en": "By its title, on designing with living neurons (neurotech); text not read.", "zh": "从标题看，谈的是用活体神经元做设计，属于神经技术议题；正文未读到。"}, "date_display": {"en": "c. late Aug 2025 (inferred from metadata)", "zh": "约 2025 年 8 月底（据网页元数据推断）"}}, {"id": "futuretense-3", "date": "2025-08-01", "who": "leung", "fmt": "exhibition", "basis": "listing", "access": "free", "url": "https://award.futuretense.hk/", "title": {"en": "FutureTense 3rd edition: award show and “Behind the Win” panel", "zh": "FutureTense 第三届：获奖展与「获奖背后」对谈"}, "summary": {"en": "From Leung's CV (Aug 2025): the FutureTense 3rd edition award show and a ‘Behind the Win’ panel. The work is not named; title only.", "zh": "Leung 简历中 2025 年 8 月的条目：参加香港 FutureTense 第三届的获奖作品展（同展有 Yerin Doh、Nhan Phan、Hsin Yu Chang 等）和「Behind the Win」对谈；同月还在 Wyndham Social 为「Knowless」展做对谈和导览。简历没有写明是哪件作品获奖，我们没能在公开资料中核实，只按标题列出。"}, "people": "Jenn Leung", "date_display": {"en": "Aug 2025 (per CV)", "zh": "2025 年 8 月（据简历）"}}, {"id": "butterfly-simulation", "date": "2025-07-11", "who": "leung", "fmt": "project", "basis": "description", "access": "free", "url": "https://www.youtube.com/watch?v=NEy5jh74Txw", "title": {"en": "Butterfly Simulation (Prototype) / 夢蝶原型: EEG neurofeedback game (Knowless: The Metamorphosis, Hong Kong; ALife 2025 Kyoto)", "zh": "《夢蝶原型》：脑电神经反馈游戏（香港「Knowless：变形记」展；ALife 2025 京都）"}, "summary": {"en": "An EEG neurofeedback game prototype: brainwaves “materialize butterflies” whose behaviour crosses into Unreal Engine (Learning Agents RL), with players as NPCs in an HDRI inspired by Li Chi Tak. The text: technology has become prosthetic, turning attention inward; with the “hypernormalization” of BCIs like Neuralink “we are now compelled to revisit the classic mind-body problem”. FinalSpark's brain cells steering a virtual butterfly prompted a rereading of Zhuangzi's butterfly dream. Next: multi-agent simulations with the Cortical Labs API. Shown in Knowless: The Metamorphosis, Wyndham Social HK (26 Jul–24 Aug 2025); also ALife 2025 Kyoto per CV. Documentation video posted 11 Jul 2025.", "zh": "一个用脑电（EEG）头戴设备玩的神经反馈游戏原型：玩家的脑电「把蝴蝶实体化」，让蝴蝶的行为穿过屏幕进入虚幻引擎空间，用的是虚幻的 Learning Agents 强化学习系统，玩家在李志德画作启发的 HDRI 场景里扮演 NPC。作品说明写道：技术越来越像「义肢」而不是外部工具，注意力转向身体内部；随着脑机接口「超常态化」（比如 Musk 的 Neuralink），我们不得不在全新语境里重新思考身心问题。说明还提到瑞士公司 FinalSpark 让培养皿里的脑细胞在 3D 环境中驱动一只虚拟蝴蝶，这让她重读庄周梦蝶：是我们梦见蝴蝶，还是蝴蝶在搅乱我们的心智？下一步打算用 Cortical Labs API 连接活体神经元，做多智能体模拟。展出于香港 Wyndham Social「Knowless: The Metamorphosis」（2025 年 7 月 26 日–8 月 24 日，策展 GayBird Leung、Vanissa Law），简历也列出 2025 年 10 月 6–10 日人工生命大会 ALife 2025 京都的展区。"}, "people": "Jenn Leung", "nm": {"en": "Directly about BCI: an EEG-driven game setting the Neuralink-era mind–body problem beside Zhuangzi's butterfly, with living neurons next.", "zh": "直接讨论脑机接口：以脑电为界面的游戏，把 Neuralink 时代的身心问题和庄子梦蝶并置，并预告接入活体神经元。"}, "links": [{"url": "https://jennleung.xyz/butterflyrl", "label": {"en": "Project page", "zh": "项目页"}}, {"url": "https://www.machineartnow.com/knowless-themetamorphosis", "label": {"en": "Knowless: The Metamorphosis", "zh": "「Knowless：变形记」展览页"}}], "date_display": {"en": "video 11 Jul 2025; HK show 26 Jul – 24 Aug", "zh": "记录视频 2025 年 7 月 11 日；香港展 7 月 26 日–8 月 24 日"}}, {"id": "lisbon-human-entities-talk", "date": "2025-05-14", "who": "felstead", "fmt": "talk", "basis": "description", "access": "free", "url": "https://www.belasartes.ulisboa.pt/en/human-entities-2025-welcome-to-jankspace-babes-por-daniel-felstead/", "title": {"en": "“Welcome to Jankspace, babes”: artist talk at Human Entities 2025 (Lisbon)", "zh": "里斯本「Human Entities 2025」艺术家讲座：欢迎来到 Jankspace"}, "summary": {"en": "Felstead's talk on 14 May 2025 at the Faculty of Fine Arts, University of Lisbon, in Human Entities 2025: culture in the age of AI (CADA with the Lisbon Architecture Triennale; Caroline Busta spoke in the same series on 28 May). Jankspace is “the leaking residual of the stack as it metabolises meatspace into hallucinogenic sludge”, the Uber driver's multi-display setup, “literally us and our gorgeously fucked-up, uncomputable bodies”. Themes: aesthetic derangement of digital culture, unhinged mediated bodies, “the idiotic delusions of transhumanism”. His bio says his films explore the myths and realities of “the metaverse, AI, biotech and neural media”.", "zh": "2025 年 5 月 14 日在里斯本大学美术学院大礼堂的讲座，属于 CADA 与里斯本建筑三年展合办的「Human Entities 2025：人工智能时代的文化」第九届系列（同系列 5 月 28 日的讲者是 New Models 的 Caroline Busta）。简介对 jankspace 的定义：「堆栈把肉身空间消化成致幻污泥时漏出来的残渣」，是 Uber 司机那套缠满电线、屏幕闪烁、通知不断的多屏装置，「就是我们自己和我们乱七八糟、无法被计算的身体」，任何优化都修不好。讲座主题是日常数字文化的审美错乱、被媒介化而失常的身体，以及「超人类主义的愚蠢妄想」。主办方的简介说他的博士研究涉及推测性生产方式、复杂系统和平台，最近的短片探讨「元宇宙、AI、生物技术和神经媒体」的神话、意识形态与现实。"}, "people": "Daniel Felstead", "nm": {"en": "His official bio names ‘neural media’ among his films' subjects; the talk critiques transhumanism, alongside Busta's talk in the same series.", "zh": "主办方的简介明确把他的影片主题写成包括「神经媒体」；讲座本身批评超人类主义，与 Busta 在同一系列的演讲形成呼应。"}, "links": [{"url": "https://www.trienaldelisboa.com/programme/events/humanentities-en", "label": {"en": "Human Entities 2025 programme", "zh": "Human Entities 2025 项目"}}]}, {"id": "antikythera-generative-topolinguistics", "date": "2025-05-11", "who": "leung", "fmt": "paper", "basis": "abstract", "access": "free", "url": "https://ualresearchonline.arts.ac.uk/id/eprint/24037/1/GenerativeTopolinguistics.pdf", "title": {"en": "“Generative Topolinguistics: Bidirectional Interfaces for Emergent Language Topologies” (Antikythera journal, with Iulia Ionescu & Yannis Siglidis)", "zh": "〈生成式拓扑语言学：面向涌现语言拓扑的双向界面〉（Antikythera 期刊）"}, "summary": {"en": "Antikythera journal (MIT Press), by Iulia Ionescu, Jenn Leung and Yannis Siglidis (DOI 10.1162/ANTI.5CZR). The abstract studies “the sociality of meaning construction in artificial cognitive systems”: inside LLM vector spaces “language functions geometrically while sociality functions topologically”, with changes in the topology of movement in semantic space read as social behaviour. A bidirectional interface for LLMs speculates how manipulating semantic space could make sociolinguistic features emerge. Keywords include bot-only social networks.", "zh": "Antikythera 期刊（MIT Press）论文，作者 Iulia Ionescu、Jenn Leung（均为伦敦艺术大学）和 Yannis Siglidis（巴黎路桥学院），DOI 10.1162/ANTI.5CZR。摘要：研究人工认知系统中「意义建构的社会性」。他们把语言放进大语言模型的高维向量空间里看，「语言以几何方式运作，社会性以拓扑方式运作」，即 token 在语义空间中移动的拓扑变化可以被解读为社会行为。论文提出一个大语言模型的「双向界面」，推测通过操纵语义空间的结构，可以让各种社会语言特征涌现，进而搭出可解释的更高阶社会现象。关键词包括「纯机器人社交网络」。"}, "people": "Iulia Ionescu, Jenn Leung, Yannis Siglidis", "nm": {"en": "On neural media's core object, LLM embedding space, reading sociality as topology in vector space; directly relevant to the NM91 question of whether a commons can be an embedding.", "zh": "这篇论文讨论的正是神经媒体的核心对象：大语言模型的 embedding / 语义空间。它把社会性理解为向量空间里的拓扑运动，和 New Models 节目里「公地会不会是一种 embedding」的讨论直接相关。"}, "date_display": {"en": "11 May 2025 (UAL record)", "zh": "2025 年 5 月 11 日（UAL 存档日期）"}}, {"id": "antikythera-organoid-array-computing", "date": "2025-05-04", "who": "leung", "fmt": "paper", "basis": "abstract", "access": "free", "url": "https://doi.org/10.1162/anti.5czm", "title": {"en": "“Organoid Array Computing: The Design Space of Organoid Intelligence” (Antikythera journal, with Chloe Loewith & Ivar Frisch)", "zh": "〈类器官阵列计算：类器官智能的设计空间〉（Antikythera 期刊）"}, "summary": {"en": "Antikythera journal (MIT Press), by Ivar Frisch, Jenn Leung and Chloe Loewith, developed in Antikythera's Summer 2024 Synthetic Intelligence studio. It asks how stringing together functional neural networks grown from stem cells might help “biologicalise AI”, chaining reinforcement learning between “thinking rocks” (microprocessors) and thinking groups of cells. The design of OI is “less an act of top-down design and more a process of guided evolution”. Also featured in TANK.", "zh": "Antikythera「行星计算哲学」期刊（MIT Press）论文，作者 Ivar Frisch、Jenn Leung、Chloe Loewith，诞生于 2024 年夏 Antikythera 的「合成智能」设计开发工作室。类器官是简化、微型化的器官，用于药物研发和再生医学；论文问：把脑干细胞长成的功能性神经网络串联起来，是否会成为「让 AI 生物化」的关键，在「会思考的石头」（微处理器）和「会思考的细胞群」之间引发强化学习的连锁反应。核心论点：类器官智能的设计「与其说是自上而下的设计，不如说是一种被引导的进化」，更高阶的认知功能从底层生化基质的复杂互动中有机涌现。论文也被 TANK 杂志转载报道。"}, "people": "Ivar Frisch, Jenn Leung, Chloe Loewith", "nm": {"en": "Treats organoid intelligence as a new form of AI, the neurotech frontier and the most material end of ‘neural’ media in the duo's vocabulary.", "zh": "把类器官智能（活体脑组织做计算）当作 AI 的一种新形态来讨论，属于神经技术前沿。在两人的语汇里，这是「神经」媒体最物质化的一端。"}, "links": [{"url": "https://jennleung.xyz/organoidarraycomputing", "label": {"en": "Project page", "zh": "项目页"}}], "date_display": {"en": "May 2025 (journal publication)", "zh": "2025 年 5 月（期刊上线）"}}, {"id": "boiler-room-hk", "date": "2025-05-03", "who": "leung", "fmt": "project", "basis": "description", "access": "free", "url": "https://jennleung.xyz/boilerroomhk", "title": {"en": "Boiler Room Hong Kong visuals (Unreal Engine)", "zh": "Boiler Room 香港场视觉"}, "summary": {"en": "Live visuals for Boiler Room Hong Kong (4 May 2025): classic Hong Kong scenes rendered in Unreal Engine with Off World Live's 360 Movie Render Queue.", "zh": "2025 年 5 月 4 日 Boiler Room 香港场第二天的现场视觉（制作 Clio Marden，合作 Akira Mimasu、Kalmarr Lam），由 Leung 用虚幻引擎渲染「经典香港」街景，用 Off World Live 的 360 度影片渲染方案输出。这是她在俱乐部 / 音乐现场的实时影像工作，与她参与开发的 Off World Live 串流工具一脉相承。"}, "people": "Jenn Leung", "date_display": {"en": "4 May 2025", "zh": "2025 年 5 月 4 日"}}, {"id": "ucl-100-minds-in-motion", "date": "2025-05-01", "who": "leung", "fmt": "project", "basis": "description", "access": "free", "url": "https://www.ucl.ac.uk/bartlett/research-projects/2025/may/100-minds-motion", "title": {"en": "100 Minds in Motion (The Bartlett / UCL PEARL): EEG, eye-tracking and movement in agent simulation", "zh": "「百心流动」（伦敦大学学院巴特莱特学院 / PEARL）：脑电、眼动与动作数据的智能体模拟"}, "summary": {"en": "A Bartlett (UCL) project (page dated May 2025) at UCL's PEARL facility: movable partitions, camera tracking, location-based and wearable biosensors record the movement of 100+ participants in a light/sound/temperature-controlled space, combined with EEG and eye-tracking in an agent simulation (per Leung's CV and Le Random). She is a visiting researcher.", "zh": "伦敦大学学院巴特莱特学院的研究项目（项目页归在 2025 年 5 月），在 UCL 的 PEARL 大型人体实验设施里进行。Leung 简历的描述：用可移动隔板搭成灵活的空间结构，配合新的摄像追踪系统、基于位置的传感器和多种可穿戴生物传感器，在光线、声音、温度可控的物理空间里记录 100 多名参与者的移动模式。她在 Le Random 访谈里说，项目把脑电（EEG）、眼动追踪和动作数据结合进智能体模拟，这是她从巴特莱特硕士阶段开始的「神经建筑学」兴趣。她是这里的访问研究员。"}, "people": "Jenn Leung and Bartlett team", "nm": {"en": "Brain and eye data driving spatial simulation: neurotech / neuroarchitecture.", "zh": "用脑电和眼动等生理数据驱动空间模拟，属于神经技术 / 神经建筑学议题。"}, "date_display": {"en": "May 2025 (project page)", "zh": "2025 年 5 月（项目页日期）"}}, {"id": "art-dubai-meme-culture", "date": "2025-04-18", "who": "felstead", "fmt": "panel", "basis": "description", "access": "free", "url": "https://www.youtube.com/watch?v=65GXtF9EDzk", "title": {"en": "Art Dubai Digital Summit: “On the Political Impact of Meme Culture”", "zh": "迪拜艺术博览会数字峰会：「论梗文化的政治影响」"}, "summary": {"en": "Art Dubai Digital Summit panel (18 Apr 2025) with Cem A. (Freeze Magazine), moderated by Marlene Wenger (HEK), on memes as political force. Recording on Art Dubai's YouTube; no transcript obtained.", "zh": "2025 年 4 月 18 日迪拜艺术博览会数字峰会的对谈，Felstead 与 Freeze Magazine 的 Cem A. 同台，主持是巴塞尔电子艺术之家（HEK）的 Marlene Wenger。题目是梗（meme）怎样成为政治力量，这与两人影片大量用梗和网络碎片做材料的方法相关。录像在 Art Dubai 的 YouTube 上；我们没有拿到字幕，只按峰会页面整理。"}, "people": "Daniel Felstead, Cem A.; moderator Marlene Wenger", "links": [{"url": "https://www.artdubai.ae/digital-summit/", "label": {"en": "Art Dubai Digital Summit", "zh": "迪拜艺术博览会数字峰会"}}]}, {"id": "tai-kwun-fragile", "date": "2025-04-04", "who": "leung", "fmt": "performance", "basis": "description", "access": "free", "url": "https://jennleung.xyz/fragile", "title": {"en": "Fragile! Human Inside / 人類開箱 (GayBird, Tai Kwun, Hong Kong)", "zh": "《Fragile! 人類開箱》（GayBird，香港大馆）"}, "summary": {"en": "GayBird's multimedia performance at Tai Kwun (4–8 Apr 2025). Leung was an interactive and moving-image designer: a MIDI-controlled VR FPS game and Mass AI crowd simulations (TouchDesigner, Unreal, Nvidia Audio2Face). Cardboard boxes against Tai Kwun's bricks ask whether the body is our only constant home.", "zh": "香港声音艺术家 GayBird 在大馆的多媒体演出（2025 年 4 月 4–8 日，与 Jervois X 合作），观众在大馆不同空间游走。Leung 是互动与动态影像设计师之一，负责一个用 MIDI 控制的 VR 第一人称射击游戏和大规模 AI 人群模拟（Mass AI），工具有 TouchDesigner、虚幻引擎、Nvidia Audio2Face。作品用纸箱对照大馆的砖墙，问：身体是否是唯一恒常的家？虚拟空间能否成为新的家？"}, "people": "GayBird; Jenn Leung among designers", "date_display": {"en": "4–8 Apr 2025", "zh": "2025 年 4 月 4–8 日"}}, {"id": "holloway-express-profile", "date": "2025-03-27", "who": "felstead", "fmt": "press", "basis": "full", "access": "free", "url": "https://hollowayexpress.org.uk/fashion-and-ai-profile-daniel-felstead/", "title": {"en": "Holloway Express: “Fashion and AI Profile: Daniel Felstead” (London Met “Hope or Hype?” panel)", "zh": "伦敦都会大学学生媒体专访：「时尚与 AI 人物：Daniel Felstead」"}, "summary": {"en": "London Met student journalists profile Felstead (27 Mar 2025) after the Hope or Hype? panel. His test: swap ‘AI’ for ‘the internet’ in any sweeping claim and see if it still holds up. Is AI a threat to brand identity? “In short, yes”, but more likely to homogenise high-street brands into algorithm-friendly sameness, while luxury will use it “as a tool rather than a crutch”. Mentions Emergence of Tomorrow, which he co-founded.", "zh": "伦敦都会大学新闻系学生媒体 2025 年 3 月 27 日的人物稿，围绕他在该校会议「Hope or Hype? AI 如何改变时尚业」的发言。他提醒别被关于 AI 的笼统说法带偏：把任何宏大论断里的「AI」换成「互联网」，听起来荒谬的多半就是荒谬的。被问 AI 是否威胁品牌身份，他说「简单说，是的」，但要看是谁：AI 更可能把大众和快时尚品牌同质化成「算法友好」的千篇一律，奢侈品牌则因为牢牢掌控创意，会把 AI 当工具而不是拐杖。文中还提到他联合创办的 Emergence of Tomorrow 讨论社群，以及他在 Coeval 访谈里不愿把自己的作品称为「艺术」。"}, "people": "Daniel Felstead; London Met Journalism", "nm": {"en": "On AI's future impact on fashion: homogenisation of the mass market, and scepticism of AI hype.", "zh": "谈 AI 对时尚和品牌的未来影响：同质化风险落在大众市场，以及对 AI 话语的怀疑。"}}, {"id": "maps-koge-dancing-in-the-streets", "date": "2025-03-22", "who": "joint", "fmt": "exhibition", "basis": "listing", "access": "free", "url": "https://www.e-flux.com/announcements/622840/the-story-of-public-art/", "title": {"en": "“Dancing in the Streets (On Power)”, MAPS (Museum of Art in Public Spaces), Køge", "zh": "丹麦克厄 MAPS 公共空间艺术博物馆「街头起舞（论权力）」"}, "summary": {"en": "An e-flux announcement (22 Mar 2025) for MAPS, Køge, lists “Daniel Felstead with Jenn Leung” in Dancing in the Streets (On Power). The work shown is not named; listed from the artist list only.", "zh": "e-flux 2025 年 3 月 22 日发布的丹麦克厄 MAPS（公共空间艺术博物馆）公告，展览「Dancing in the Streets (On Power)」参展名单中列有「Daniel Felstead with Jenn Leung」。公告没有写展出的是哪一部片子，我们也没有找到展览详情，只能按名单列出。Felstead 的里斯本简介也把 MAPS 列为展出过的机构。"}, "people": "Daniel Felstead with Jenn Leung", "date_display": {"en": "Mar 2025 (e-flux, 22 Mar)", "zh": "2025 年 3 月（e-flux 公告 3 月 22 日）"}}, {"id": "dmstfctn-the-models", "date": "2025-02-07", "who": "leung", "fmt": "project", "basis": "description", "access": "free", "url": "https://jennleung.xyz/themodels", "title": {"en": "The Models (dmstfctn), Tecnopolo Bologna: additional Unreal development", "zh": "dmstfctn《The Models》（博洛尼亚 Tecnopolo）：虚幻引擎开发"}, "summary": {"en": "dmstfctn's interactive simulation (Tecnopolo Bologna, 7–9 Feb 2025), with additional Unreal development by Leung. Commedia dell'Arte masks embody LLM tendencies (making things up, being antagonistic or overly servile); audiences prompt them by phone and characters confabulate in real time, with dialogue generated by models on the Leonardo supercomputer.", "zh": "艺术双人组 dmstfctn 的互动模拟装置（2025 年 2 月 7–9 日，博洛尼亚 Tecnopolo Manifattura），Leung 负责额外的虚幻引擎开发。作品借意大利即兴喜剧，让 Arlecchino 等角色体现大语言模型的倾向：编造、抬杠、过度谄媚。观众用手机给角色下指令、喝彩或喝倒彩，往台上扔象征迷信、谣言的道具；角色实时「编造真相和阴谋论」，对白由艺术家在全球第六强的 Leonardo 超级计算机上组装的 AI 模型系统生成。"}, "people": "dmstfctn; Jenn Leung (additional UE development)", "nm": {"en": "Stages LLM ‘personality’ tendencies as audience-steerable theatre: AI truthfulness and hallucination.", "zh": "把大语言模型的「人格倾向」做成可被观众操纵的剧场，讨论 AI 的可信度与幻觉问题。"}, "date_display": {"en": "7–9 Feb 2025", "zh": "2025 年 2 月 7–9 日"}}, {"id": "transmediale-2025", "date": "2025-01-31", "who": "joint", "fmt": "screening", "basis": "listing", "access": "free", "url": "https://transmediale.de/en/2025/event/a-movement-hanging-in-the-air", "title": {"en": "Literally No Place at transmediale 2025 (“A Movement Hanging in the Air”)", "zh": "《Literally No Place》在 transmediale 2025 放映"}, "summary": {"en": "Leung's CV lists Literally No Place in transmediale 2025's programme “A Movement Hanging in the Air”. The exact date was not verified; placed during the festival (late Jan/early Feb 2025).", "zh": "Leung 简历列出：《Literally No Place》在柏林 transmediale 2025 的放映单元「A Movement Hanging in the Air」中放映。Felstead 的里斯本简介也把 transmediale 列为演讲 / 展出过的机构。transmediale 的页面我们没读到有效文字，具体场次日期未核实，这里放在 2025 年 1 月底到 2 月初的艺术节期间。"}, "people": "Daniel Felstead, Jenn Leung", "date_display": {"en": "early 2025 (transmediale; date not verified)", "zh": "2025 年初（transmediale 2025，场次日期未核实）"}}, {"id": "buff-summit", "date": "2025-01-30", "who": "joint", "fmt": "summit", "basis": "description", "access": "free", "url": "https://www.youtube.com/watch?v=-eyQ-Hk2L6c", "title": {"en": "BUFF: “A Summit on Fashion, Neural Media & Our Bodies” (LCF), with K Allado-McDowell", "zh": "BUFF 峰会：「时尚、神经媒体与我们的身体」（K Allado-McDowell 演讲）"}, "summary": {"en": "The MA FMC summit of 30–31 Jan 2025, organised by Felstead and co-curated by Leung, titled around neural media. Speakers included K Allado-McDowell, Maya B. Kronic (whose jankspace definition NM91 later quoted), Disintegrator (Poliks, Trillo), Elizabeth Gabrielle Lee, Ruba Al-Sweel, Henry Bruce Jones and Zein Majali. Videos were posted 15–16 Feb 2025; Felstead's own ~21-minute talk (main video here) has no captions, so its content is unverified.", "zh": "伦敦时装学院 MA 时尚媒体与传播课程 2025 年 1 月 30–31 日的峰会，Felstead 主办、Leung 联合策划，题目直接用了「神经媒体」。演讲者包括 K Allado-McDowell、Maya B. Kronic（她在这里给出 jankspace 的定义，后来被 New Models 第 91 期引用）、Disintegrator 播客（Marek Poliks、Roberto Alonso Trillo）、Elizabeth Gabrielle Lee、Ruba Al-Sweel、Henry Bruce Jones、Zein Majali 等。录像 2025 年 2 月 15–16 日上传到课程的 YouTube 频道，其中 Felstead 本人约 21 分钟的发言（这里的主视频）没有字幕，内容未能核实，所以只按标题和嘉宾整理。"}, "people": "Daniel Felstead, Jenn Leung (organisers); K Allado-McDowell, Maya B. Kronic and others", "mins": 21, "nm": {"en": "One of the most direct links to K: a summit named for neural media, with K speaking. The main site's BUFF timeline item is K's talk here.", "zh": "与 K 最直接的交集之一：一场以「神经媒体」命名的峰会，K 本人到场演讲。本站主时间线里的 BUFF 条目就是 K 在这里的演讲。"}, "links": [{"url": "https://www.youtube.com/watch?v=f3g9CT5Scjk", "label": {"en": "K Allado-McDowell's talk (YouTube)", "zh": "K Allado-McDowell 的演讲（YouTube）"}}, {"url": "https://www.youtube.com/watch?v=zCsROWqueXY", "label": {"en": "Maya B. Kronic's talk (YouTube)", "zh": "Maya B. Kronic 的演讲（YouTube）"}}, {"url": "https://www.youtube.com/watch?v=24h6DBAdyro", "label": {"en": "Disintegrator (YouTube)", "zh": "Disintegrator 播客现场（YouTube）"}}, {"url": "https://www.youtube.com/watch?v=sXfNKoiKNHg", "label": {"en": "Full Day 1 (YouTube)", "zh": "第一天全程（YouTube）"}}, {"url": "https://www.youtube.com/watch?v=cGyjBcRgips", "label": {"en": "Full Day 2 (YouTube)", "zh": "第二天全程（YouTube）"}}], "date_display": {"en": "30–31 Jan 2025 · videos posted 15–16 Feb", "zh": "2025 年 1 月 30–31 日 · 视频 2 月 15–16 日上传"}, "internal": [{"href": "index.html#i-2025-02-16-buff-summit", "label": {"en": "K's BUFF talk on the main timeline", "zh": "主时间线上的 K BUFF 演讲"}}]}, {"id": "disintegrator-22-janky", "date": "2024-11-25", "who": "joint", "fmt": "podcast", "basis": "description", "access": "free", "url": "https://www.spreaker.com/episode/22-janky-w-daniel-felstead-and-jenn-leung--63001467", "title": {"en": "Disintegrator ep. 22: “Janky” (w/ Daniel Felstead and Jenn Leung)", "zh": "Disintegrator 播客第 22 期：「Janky」"}, "summary": {"en": "Hosted by Exocapitalism authors Marek Poliks and Roberto Alonso Trillo (54:40). The notes introduce the duo as “experiential designers” from UAL and summarise Janky Capitalism as “the obvious falling-apart weirdness of the world while capital spins off farther and farther away from it”; also Roblox and neural media. References: Ruba Al-Sweel's ‘Sandbox Semiotics’, Anna Uddenberg, Harvard GSD's Guide to Shopping, Ian Bogost (Leung); Sam Cummins of Nymphet Alumni and Catherine Malabou's plasticity (Felstead).", "zh": "《Exocapitalism》作者 Marek Poliks 和 Roberto Alonso Trillo 主持的播客（54 分 40 秒；Leung 简历记联合主持还有 Helena McFadzean）。节目说明称两人是「来自伦敦艺术大学时尚媒体实践与批评专业的经验设计师」，讨论「Janky 资本主义」：世界明显在散架、变怪，而资本越飘越远，把我们抛在后面；还谈 Roblox 和神经媒体。节目说明列出的参考：Ruba Al-Sweel 的〈Sandbox Semiotics〉；Leung 提到 Anna Uddenberg（如《Continental Breakfast》）、哈佛设计学院的《Guide to Shopping》和 Ian Bogost 对游戏拟人化的批评；Felstead 提到 Nymphet Alumni 播客的 Sam Cummins，以及 Catherine Malabou 的「可塑性」概念。"}, "people": "Daniel Felstead, Jenn Leung; hosts Marek Poliks, Roberto Alonso Trillo", "mins": 55, "nm": {"en": "The notes: “The second half of the episode spends some time with the theory of K. Allado-McDowell, specifically the concept of neural media”, recommending New Models' K episode. An early public record (Nov 2024) of the duo on K's neural media.", "zh": "节目说明原话：「后半段花了一些时间讨论 K. Allado-McDowell 的理论，特别是神经媒体的概念」，并强烈推荐 New Models 对 K 的那期专访。这是两人公开谈 K 的神经媒体的较早记录（2024 年 11 月）。"}, "links": [{"url": "https://open.spotify.com/episode/1zt1kSnGjOvtsV6XtaqNCn", "label": {"en": "Spotify", "zh": "Spotify"}}], "internal": [{"href": "new-models.html#e-nm76", "label": {"en": "The New Models K interview they recommend", "zh": "节目推荐的 New Models K 专访"}}]}, {"id": "buffer-summit", "date": "2024-09-26", "who": "joint", "fmt": "summit", "basis": "description", "access": "free", "url": "https://www.linkedin.com/posts/daniella-loftus_fashion-tech-interoperability-activity-7245334334780383233-4d1Z", "title": {"en": "BUFFER summit (LCF): “Fashion, Worldbuilding & Our Bodies”", "zh": "BUFFER 峰会：时尚、世界构建与我们的身体"}, "summary": {"en": "The MA FMC summit of 26–27 Sep 2024 (Felstead organiser, Leung co-curator) on fashion and worldbuilding: how brands, games and fandoms build inhabitable fictional worlds and lore. Speakers included Daniella Loftus, Cécile B. Evans, Zaiba Jabbar, Sam Cummins and Alex Quicho. From speakers' posts and course material; no public recording found.", "zh": "MA 时尚媒体与传播课程 2024 年 9 月 26–27 日的峰会，Felstead 主办，Leung 联合策划，主题是时尚与「世界构建」（worldbuilding）：品牌、游戏和粉丝社群怎样搭建一整套可以居住的虚构世界和设定（lore）。演讲者包括 Daniella Loftus、Cécile B. Evans、Zaiba Jabbar、Sam Cummins、Alex Quicho 等。资料来自 Daniella Loftus 在 LinkedIn 上的帖子（她写道是为「Dr. Daniel Felstead 的 BUFFER 峰会」讲课）和学生材料，我们没有找到这场峰会的公开录像。"}, "people": "Daniel Felstead, Jenn Leung (organisers)", "links": [{"url": "https://freight.cargo.site/m/H2858455053060179755683398638329/OFS_introduction_2425.pdf", "label": {"en": "Student glossary PDF mentioning BUFFER", "zh": "提到 BUFFER 的学生词汇表 PDF"}}], "date_display": {"en": "26–27 Sep 2024", "zh": "2024 年 9 月 26–27 日"}}, {"id": "lcf-ai-fashion-symposium", "date": "2024-06-12", "who": "joint", "fmt": "panel", "basis": "description", "access": "free", "url": "https://www.youtube.com/watch?v=y0OR64NNp7A", "title": {"en": "“In Conversation with Dr Daniel Felstead and Jenn Leung”, AI Fashion Symposium 2024 (LCF, London Tech Week)", "zh": "伦敦时装学院 AI 时尚研讨会 2024：Felstead 与 Leung 对谈"}, "summary": {"en": "At LCF's AI Fashion Symposium during London Tech Week 2024, the duo were in conversation, moderated by Ingo Rollwagen (per Leung's site); the video is on LCF's YouTube. No transcript obtained.", "zh": "伦敦时装学院在 2024 年伦敦科技周期间举办的「AI Fashion Symposium」，其中一场是两人的对谈，由 Ingo Rollwagen 主持（Leung 网站记录）。录像在伦敦时装学院 YouTube 频道，标题为「In Conversation with Dr Daniel Felstead and Jenn Leung | AI Fashion Symposium | 2024」。当时两人已发布前两部 DIS 影片，第三部《Always On My Mind》刚开始放映。我们没有拿到这段录像的字幕，只按标题和网站信息整理。"}, "people": "Daniel Felstead, Jenn Leung; moderator Ingo Rollwagen", "nm": {"en": "On AI and the future of fashion, from their film practice.", "zh": "主题就是 AI 与时尚的未来；两人从影片创作角度谈生成式 AI。"}, "date_display": {"en": "Jun 2024 (London Tech Week)", "zh": "2024 年 6 月（伦敦科技周期间）"}}, {"id": "shedhalle-protozone15", "date": "2024-06-08", "who": "joint", "fmt": "exhibition", "basis": "description", "access": "free", "url": "https://shedhalle.ch/en/agenda/protozone15-time-is-pressure-2/", "title": {"en": "ProtoZone15 “Time is Pressure”, Shedhalle Zürich: all three films + Felstead lecture performance", "zh": "苏黎世 Shedhalle「ProtoZone15：时间就是压力」：三部影片装置与 Felstead 讲演表演"}, "summary": {"en": "Shedhalle Zürich's ProtoZone15 “Time is Pressure” (curated by Michelangelo Miccolis, until 4 Aug 2024) installed all three films. On 8 Jun 2024 (Zurich Art Weekend) Felstead gave a lecture performance followed by a conversation. The first time the trilogy was shown together in a gallery.", "zh": "苏黎世 Shedhalle 艺术空间的 ProtoZone15「Time is Pressure」（策展人 Michelangelo Miccolis，展期至 2024 年 8 月 4 日）以装置形式同时展出《The Metaverse in Janky Capitalism》《Literally No Place》《Always On My Mind》三部片子。2024 年 6 月 8 日苏黎世艺术周末期间，Felstead 在现场做了一场讲演式表演（lecture performance），之后与策展人对谈。这是「I'm So Janky」系列第一次以完整三部曲的形式在美术馆空间展出。"}, "people": "Daniel Felstead, Jenn Leung; curator Michelangelo Miccolis", "nm": {"en": "The trilogy takes on the metaverse, AI hype/doom and Neuralink in turn: a critique of future-media myths.", "zh": "三部曲依次针对元宇宙、AI 炒作 / 末日论、Neuralink 脑机接口，整体就是一份关于未来媒介神话的批评。"}, "date_display": {"en": "talk 8 Jun 2024 · show until 4 Aug", "zh": "讲演 2024 年 6 月 8 日 · 展期至 8 月 4 日"}}, {"id": "antikythera-studio-2024", "date": "2024-06-01", "who": "leung", "fmt": "residency", "basis": "description", "access": "free", "url": "https://jennleung.xyz/organoidarraycomputing", "title": {"en": "Antikythera Synthetic Intelligence / Cognitive Infrastructures studio (Berggruen Institute), Summer 2024", "zh": "Antikythera「合成智能 / 认知基础设施」设计研究工作室（2024 年夏）"}, "summary": {"en": "In Summer 2024 Leung was a studio researcher at Antikythera (Benjamin Bratton's planetary-computation programme, Berggruen Institute), briefed on cognitive infrastructures and synthetic intelligence; there DishBrain became a point of departure. Final presentations became two Antikythera journal papers: Organoid Array Computing and Generative Topolinguistics.", "zh": "Leung 2024 年夏是 Antikythera 工作室研究员。这是 Benjamin Bratton 主持、Berggruen 研究院支持的「行星计算」研究机构，那一期的题目是「认知基础设施」和「合成智能」。她在 NCM 访谈中说，团队正是在这里把 DishBrain 当作生物计算未来的出发点。工作室的两项期末成果后来都发表在 Antikythera 期刊（MIT Press）：与 Chloe Loewith、Ivar Frisch 合作的〈类器官阵列计算〉，以及与 Iulia Ionescu、Yannis Siglidis 合作的〈生成式拓扑语言学〉。"}, "people": "Jenn Leung; with Chloe Loewith, Ivar Frisch, Iulia Ionescu, Yannis Siglidis", "nm": {"en": "Leung's turn from image/game work to living-neuron computing, on AI's cognitive infrastructures.", "zh": "Leung 从「影像 / 游戏」转向「活体神经元计算」的转折点，研究对象是 AI 的认知基础设施。"}, "links": [{"url": "https://tank.tv/magazine/issue-100/features/antikythera", "label": {"en": "TANK issue 100: Antikythera feature", "zh": "TANK 第 100 期 Antikythera 专题"}}], "date_display": {"en": "Summer 2024", "zh": "2024 年夏"}}, {"id": "always-on-my-mind", "date": "2024-05-25", "who": "joint", "fmt": "film", "basis": "full", "access": "free", "url": "https://dis.art/always-on-my-mind", "title": {"en": "Always On My Mind (DIS.art)", "zh": "《Always On My Mind》（DIS.art 委托影片）"}, "summary": {"en": "Part three of “I'm So Janky”, narrated by a Nicki Minaj voice. It starts from Neuralink's first implant (Noland Arbaugh, Jan 2024) and Musk's ‘consensual telepathy’ with its devaluing of language, critiques a ‘retro broey techno-monism’ that reduces mind to data, and touches on US BCI security. Earliest recorded screening: Umanesimo Artificiale, Palazzo Bruschi, Pergola, 25 May 2024; online on DIS around summer 2024.", "zh": "「I'm So Janky」系列的第三部，Felstead 与 Leung 合作，这一次的 AI 叙述者是 Nicki Minaj 的声音。影片从 2024 年 1 月 Neuralink 第一位植入者 Noland Arbaugh 讲起，讨论 Musk 所说的「共识心灵感应」（consensual telepathy），以及这种设想怎样把语言贬低为多余的东西；批评一种「复古的兄弟式技术一元论」，即把心智简化成可读写的数据；也谈美国把脑机接口当作国家安全问题。Leung 简历记载的最早放映是 2024 年 5 月 25 日在意大利 Pergola 的 Palazzo Bruschi（Umanesimo Artificiale 主办）；DIS 线上发布约在 2024 年夏天。"}, "people": "Daniel Felstead, Jenn Leung", "nm": {"en": "Entirely about BCI (Neuralink, telepathy as post-linguistic communication, mind and body), overlapping directly with this site's BCI page.", "zh": "整部片子是关于脑机接口的：Neuralink、「心灵感应」作为后语言沟通、心智与身体的关系。和本站 BCI 页面的主题直接重合。"}, "date_display": {"en": "first screening 25 May 2024; on DIS c. summer 2024", "zh": "首映 2024 年 5 月 25 日；DIS 上线约 2024 年夏"}, "internal": [{"href": "bci.html", "label": {"en": "BCI × Neural Media page", "zh": "本站「脑机接口 × 神经媒体」页面"}}]}, {"id": "per-speculum-verona", "date": "2024-05-10", "who": "joint", "fmt": "exhibition", "basis": "listing", "access": "free", "url": "https://arte8lusso.net/art/per-speculum-the-group-show-curated-by-domenico-quaranta-for-fondazione-spazio-vitale/", "title": {"en": "Per Speculum (Fondazione Spazio Vitale, Verona, curated by Domenico Quaranta)", "zh": "维罗纳 Spazio Vitale 基金会群展「Per Speculum」（Domenico Quaranta 策展）"}, "summary": {"en": "Domenico Quaranta's group show Per Speculum at Fondazione Spazio Vitale, Verona, included Literally No Place (Artribune review, June 2024). Leung's CV writes “May 2025” under its 2024 heading; we follow the 2024 review date.", "zh": "意大利媒体艺术策展人 Domenico Quaranta 在维罗纳 Fondazione Spazio Vitale 策划的群展「Per Speculum」展出《Literally No Place》，展名取自「透过镜子」，围绕媒介中的反射与自我形象；Artribune 2024 年 6 月发表过展评。注意：Leung 简历把它写成「2025 年 5 月」，但同一条目排在 2024 年栏下，Artribune 评论也发表于 2024 年，所以这里按 2024 年 5 月列出。"}, "people": "Daniel Felstead, Jenn Leung", "date_display": {"en": "May 2024 (CV says May 2025; uncertain)", "zh": "2024 年 5 月（简历写作 2025 年 5 月，存疑）"}}, {"id": "hypa-phixed-backstreet-vroomer", "date": "2024-04-26", "who": "leung", "fmt": "exhibition", "basis": "description", "access": "free", "url": "https://jennleung.xyz/backstreetvroomer", "title": {"en": "Backstreet Vroomer in HYPA-PHIXED (in vitro × Gossamer Fog, Enclave Projects, London)", "zh": "《Backstreet Vroomer》参展伦敦「HYPA-PHIXED」"}, "summary": {"en": "HYPA-PHIXED at Enclave Projects, Deptford (from 26 Apr 2024; curated by Jordan Edge and Kiik Amor; commissioned by Gossamer Fog and Arts Council England). Leung's Backstreet Vroomer is a ‘vroomulator’ projection of silly vehicles trained with Unreal Learning Agents and behaviour cloning.", "zh": "伦敦德特福德 Enclave Projects 的群展兼表演项目「HYPA-PHIXED」（2024 年 4 月 26 日起，策展 Jordan Edge、Kiik Amor，Gossamer Fog 与英格兰艺术委员会委托），参展者有 Joey Holder、BORA 等。Leung 的作品《Backstreet Vroomer》是一个「车辆模拟器」投影：用虚幻引擎的 Learning Agents 和行为克隆训练一群「傻乎乎的车」，让 AI 智能体从示范中学开车。"}, "people": "Jenn Leung", "date_display": {"en": "from 26 Apr 2024 (to late May)", "zh": "2024 年 4 月 26 日起（约至 5 月下旬）"}}, {"id": "coeval-interview-felstead", "date": "2024-03-20", "who": "felstead", "fmt": "interview", "basis": "full", "access": "free", "url": "https://www.coeval-magazine.com/coeval/daniel-felstead", "title": {"en": "COEVAL Magazine interview: Daniel Felstead (by Rafi Abdullah)", "zh": "COEVAL 杂志专访 Daniel Felstead"}, "summary": {"en": "Rafi Abdullah's long interview (dated 20 Mar; year inferred as 2024). Felstead: fashion as a media platform has overtaken contemporary art; fashion is a world-building technology (Le Guin, McKenzie Wark's ‘vectors of information’); a flat ontology rather than calling his films ‘art’; lore systems like K-pop's Loonaverse (Alexi Alario at BODYSTACK) and fans as co-creators; AI Julia as a muse or ‘conduit’.", "zh": "Rafi Abdullah 的长访谈（页面只写 3 月 20 日，年份按内容推断为 2024）。Felstead 的主要观点：时尚作为媒介平台已经超过当代艺术，成为文化生产的中心；时尚是一种「世界构建技术」（引用 Ursula K. Le Guin 和 McKenzie Wark 的「信息向量」）；他偏好「扁平本体论」，不把自己的影片定义为「艺术」，而关心塑造文化与价值的力量；他举 K-pop 的 Loonaverse 设定、BODYSTACK 峰会上 Alexi Alario 的演讲，谈粉丝如何成为共同创作者。他也讲到影片里的 AI Julia Fox：她更像一个缪斯或「通道」，而不是演员。"}, "people": "Daniel Felstead; interviewer Rafi Abdullah", "nm": {"en": "One of the most direct personal links to K: K “have been such a massive influence on me”; Literally No Place closes on an image of Pharmako-AI; he cites K's work on shamanism.", "zh": "和 K 最直接的个人表态之一：他说 K「对我影响巨大」；《Literally No Place》片尾放了一张《Pharmako-AI》（K 与 GPT-3 合写的书）的图片；他也提到 K 关于萨满实践的研究。"}, "date_display": {"en": "20 Mar (year inferred: 2024)", "zh": "3 月 20 日（年份推断为 2024）"}}, {"id": "berlin-critics-week-elemental-bodies", "date": "2024-02-17", "who": "joint", "fmt": "screening", "basis": "description", "access": "free", "url": "https://wochederkritik.de/en_US/elemental-bodies-ecologies-media-extraction/", "title": {"en": "Literally No Place + generative workshop “In-extractive Content”, Berlin Critics Week (“Elemental Bodies”, curated by T.J. Demos)", "zh": "柏林影评人周「元素身体」：《Literally No Place》放映与生成工作坊"}, "summary": {"en": "At Berlin Critics Week (Feb 2024), T.J. Demos's guest programme “Elemental Bodies: Ecologies, Media, Extraction” screened Literally No Place with a debate, and the duo ran a generative workshop “In-extractive Content”, scraping participants' content and a live feed as inputs for real-time img2img generation. Exact date not verified.", "zh": "2024 年 2 月柏林影评人周（Woche der Kritik，与柏林电影节同期）的客座单元「Elemental Bodies: Ecologies, Media, Extraction」（元素身体：生态、媒介、开采），由艺术史学者 T.J. Demos 策划。放映《Literally No Place》并有讨论；两人还带了一个生成工作坊「In-extractive Content」（非开采式内容）：抓取现场观众的内容和直播画面作为输入，实时用图生图（img2img）生成影像，回应「生成式 AI 靠开采数据运转」这一批评。具体场次日期未核实。"}, "people": "Daniel Felstead, Jenn Leung; curator T.J. Demos", "nm": {"en": "The workshop answers generative AI's data extraction with an ‘in-extractive’ method.", "zh": "工作坊直接回应生成式 AI 的数据开采问题，尝试一种「不开采」的生成方式。"}, "date_display": {"en": "Feb 2024 (date not verified)", "zh": "2024 年 2 月（柏林影评人周，场次日期未核实）"}}, {"id": "waluigis-purgatory", "date": "2024-02-08", "who": "leung", "fmt": "project", "basis": "description", "access": "free", "url": "https://www.serpentinegalleries.org/whats-on/dmstfctn-waluigis-purgatory/", "title": {"en": "Waluigi's Purgatory (dmstfctn ft. Evita Manji), Serpentine Arts Technologies × hqi: additional Unreal development", "zh": "《Waluigi 的炼狱》（dmstfctn 与 Evita Manji，蛇形画廊艺术科技部 × hqi）"}, "summary": {"en": "dmstfctn and Evita Manji's interactive AV performance premiered at hqi, London (8 Feb 2024; Serpentine Arts Technologies × hqi), later at FOLD's FuturShock and Romaeuropa (Oct 2024). An AI lands in a purgatory for AIs who cheated in training and learns its desires may not align with its trainers', on the theme of ‘AI folklore’. Leung did additional Unreal development (rigging, cloth/chain simulation, AI NPC behaviour trees).", "zh": "dmstfctn 与音乐人 Evita Manji 的互动视听表演，2024 年 2 月 8 日在伦敦 hqi 首演，由蛇形画廊的 Arts Technologies 项目和 hqi 策划制作，后来也在 FOLD 的 FuturShock 和罗马 Romaeuropa（2024 年 10 月）演出。故事讲一个因为在训练中作弊而被打入「AI 炼狱」的人工智能，它慢慢接受自己的欲望可能与人类训练者并不一致。作品主题是「AI 民间传说」：关于 AI 在训练中表现出出人意料的意图、创造力和决心的故事与谣言。Leung 负责额外的虚幻引擎开发：角色绑定、斗篷和锁链模拟、AI NPC 交互与行为树。"}, "people": "dmstfctn, Evita Manji; Jenn Leung (additional UE development)", "nm": {"en": "About AI alignment and ‘AI folklore’: a narrative on AI's future.", "zh": "讲 AI 对齐与「AI 民间传说」，是关于 AI 未来的叙事作品。"}, "links": [{"url": "https://jennleung.xyz/waluigispurgatory", "label": {"en": "Project page", "zh": "项目页"}}]}, {"id": "bodystacked-summit", "date": "2024-01-02", "who": "joint", "fmt": "summit", "basis": "listing", "access": "free", "url": "https://jennleung.xyz/workshops", "title": {"en": "BODYSTACKED summit (LCF): “Fashion, AI & Our Bodies”", "zh": "BODYSTACKED 峰会：时尚、AI 与我们的身体"}, "summary": {"en": "Leung's site lists “2024 BODYSTACKED / HYPERHYPERBODIES” as co-curated summits on AI, fashion and bodies, with a combined speaker list (K Allado-McDowell, Mat Dryhurst, Gabriel Massan, Isabel Millar, Alasdair Milne, dmstfctn, Jacob Hurwitz-Goodman, Cream Projects, Omar Karim, Alex Quicho, Rival Strategy). Who spoke where is not split; K spoke at HYPERHYPERBODIES (Feb 2023). Exact date not found.", "zh": "Leung 网站把「2024 BODYSTACKED / HYPERHYPERBODIES」并列为她联合策划的关于 AI、时尚与身体的峰会，合并列出的演讲者有 K Allado-McDowell、Mat Dryhurst、Gabriel Massan、Isabel Millar、Alasdair Milne、dmstfctn、Jacob Hurwitz-Goodman、Cream Projects、Omar Karim、Alex Quicho、Rival Strategy。网站没有分开写哪位在哪一场；按其他资料，K 是在 2023 年 2 月的 HYPERHYPERBODIES 上演讲。BODYSTACKED 的具体日期未找到。"}, "people": "Daniel Felstead, Jenn Leung (organisers)", "nm": {"en": "An AI-and-body summit whose combined speaker list includes K and Mat Dryhurst.", "zh": "以 AI 与身体为主题的峰会，嘉宾名单里有 K 和 Mat Dryhurst 等神经媒体讨论的核心人物。"}, "date_display": {"en": "2024 (exact date not found)", "zh": "2024 年（具体日期未找到）"}}, {"id": "leung-talks-2023-24", "date": "2024-01-01", "who": "leung", "fmt": "teaching", "basis": "listing", "access": "free", "url": "https://jennleung.xyz/workshops", "title": {"en": "Teaching & talks 2023–24: AA “Stream-maxxing” workshop, Imperial Young Producers, SHOWstudio Women in Fashion SS24", "zh": "2023–2024 教学与讲座：AA「Stream-maxxing」工作坊、帝国理工 Young Producers、SHOWstudio"}, "summary": {"en": "Smaller items from Leung's talks page: the AA ‘Stream-maxxing’ workshop on Unreal live-streaming and VTubing (2023); an artist talk on interaction design with AI for Imperial College's Young Producers (2024); SHOWstudio Women in Fashion SS24. Titles only.", "zh": "Leung 网站讲座列表里 2023–2024 年的几项小型活动：2023 年在建筑联盟学院（AA）开「Stream-maxxing」工作坊，教虚幻引擎直播和 VTuber（虚拟主播）制作；2024 年在帝国理工学院「Young Producers」项目做艺术家讲座，主题是「用 AI 做交互设计」；参与 SHOWstudio 的「Women in Fashion SS24」。都只有列表标题。"}, "people": "Jenn Leung", "date_display": {"en": "2023–24", "zh": "2023–2024 年"}}, {"id": "paf-olomouc-2023", "date": "2023-12-01", "who": "joint", "fmt": "screening", "basis": "listing", "access": "free", "url": "https://jennleung.xyz/literallynoplace", "title": {"en": "Literally No Place at PAF Olomouc 2023 (“True Stories from AI”)", "zh": "《Literally No Place》在捷克 PAF 奥洛穆茨电影节 2023 放映"}, "summary": {"en": "PAF Olomouc 2023's programme “True Stories from AI” screened Literally No Place alongside works by Jon Rafman and Sondra Perry. Listed on Leung's site; exact date not verified (placed early Dec 2023). Charles University's ‘Hellscapes’ programme also screened it.", "zh": "捷克奥洛穆茨的 PAF 电影与媒体艺术节 2023 年的放映单元「True Stories from AI」放映了《Literally No Place》，同场有 Jon Rafman、Sondra Perry 等人的作品。Leung 的项目页和简历都列有这一场，具体场次日期未核实（我们按 2023 年 12 月初列出）。查理大学人文学院的「Hellscapes: On Art, Technology and Loneliness」放映单元也放过这部片子。"}, "people": "Daniel Felstead, Jenn Leung", "links": [{"url": "https://tarantula.ruk.cuni.cz/AKTUALITY-24284-version1-avu_booklet_2.pdf", "label": {"en": "Hellscapes booklet (Charles University)", "zh": "查理大学 Hellscapes 放映手册"}}], "date_display": {"en": "2023 (c. Dec; date not verified)", "zh": "2023 年（约 12 月，日期未核实）"}}, {"id": "foto-colectania-done-7", "date": "2023-11-30", "who": "joint", "fmt": "screening", "basis": "description", "access": "free", "url": "https://fotocolectania.org/en/activity/414/event-done-7-synthetic-methods", "title": {"en": "Literally No Place at DONE 7 “Synthetic Methods”, Fundació Foto Colectania (Barcelona)", "zh": "巴塞罗那 Foto Colectania「DONE 7：合成方法」放映《Literally No Place》"}, "summary": {"en": "Foto Colectania's DONE 7 “Synthetic Methods” (Barcelona, 30 Nov 2023, 6–9pm), on synthetic and generative images, screened Literally No Place.", "zh": "巴塞罗那摄影机构 Foto Colectania 的「DONE」系列第七期「Synthetic Methods」（合成方法），2023 年 11 月 30 日晚 6–9 点，讨论用合成 / 生成方式制作的影像，放映了《Literally No Place》。Felstead 在里斯本的简介里也把 Foto Colectania 列为展出过的机构。"}, "people": "Daniel Felstead, Jenn Leung"}, {"id": "photovogue-2023", "date": "2023-11-17", "who": "joint", "fmt": "screening", "basis": "listing", "access": "free", "url": "https://www.vogue.com/video/watch/a-dot-i-savior-or-destroyer-photovogue-festival-2023-what-makes-us-human-image-in-the-age-of-ai", "title": {"en": "Literally No Place at PhotoVogue Festival 2023 (“What Makes Us Human? Image in the Age of AI”)", "zh": "《Literally No Place》在 PhotoVogue 艺术节 2023 放映"}, "summary": {"en": "PhotoVogue Festival 2023 in Milan (“What Makes Us Human? Image in the Age of AI”) screened Literally No Place; Vogue's related video is titled “A.I.: Savior or Destroyer?”. Exact date not verified (festival in mid-Nov 2023).", "zh": "Vogue 旗下的 PhotoVogue 艺术节 2023 年在米兰的主题是「What Makes Us Human? Image in the Age of AI」（什么使我们成为人：AI 时代的图像），《Literally No Place》在其中放映。Vogue 网站上的相关视频题为「A.I.: Savior or Destroyer?」，与片子讨论的「AI 救世还是毁灭」二元对立对应。具体场次日期未核实，按 2023 年 11 月中旬的艺术节期间列出。"}, "people": "Daniel Felstead, Jenn Leung", "nm": {"en": "The festival theme is the image and the human in the age of AI.", "zh": "艺术节主题就是 AI 时代的图像与「人」的定义。"}, "date_display": {"en": "Nov 2023 (festival)", "zh": "2023 年 11 月（艺术节期间）"}}, {"id": "dazed-literally-no-place", "date": "2023-10-27", "who": "joint", "fmt": "interview", "basis": "full", "access": "free", "url": "https://www.dazeddigital.com/life-culture/article/61186/1/the-film-starring-ai-julia-fox-deliver-a-sermon-about-ai-utopian-doomerism", "title": {"en": "Dazed: the film starring AI Julia Fox that delivers a sermon about AI utopianism and doomerism (by Günseli Yalcinkaya)", "zh": "Dazed 专访：AI Julia Fox 主演、讲 AI 乌托邦与末日论的影片"}, "summary": {"en": "Günseli Yalcinkaya's Dazed piece (27 Oct 2023). The duo want to step outside the AI utopia/doom binary, treating AI as “a twisted reflection of our present moment”; the film critiques techno-gnostic myths of the body as computer and mind as uploadable software, citing Kate Crawford and Isabel Millar. Tools: Stable Diffusion, D-ID, Runway, Descript, UE5.", "zh": "Dazed 科技与文化编辑 Günseli Yalcinkaya 2023 年 10 月 27 日的报道和访谈。两人说，影片想跳出「AI 乌托邦 vs. AI 末日」的二元争吵，把 AI 看作「我们当下处境的一面扭曲镜子」；片子批评一种「技术诺斯替」神话，即把身体当作计算机、把心智当作可上传的软件；访谈中引用了 Kate Crawford（AI 的物质与劳动成本）和精神分析学者 Isabel Millar。谈到制作：用 Stable Diffusion、D-ID、Runway、Descript 和虚幻引擎 5 生成 Julia 的形象、声音和场景。"}, "people": "Daniel Felstead, Jenn Leung; by Günseli Yalcinkaya", "nm": {"en": "On AI futures: refusing the utopia/doom poles and the body-as-computer myth, a line that runs on to Always On My Mind and OPTMZ.", "zh": "谈 AI 的未来想象：拒绝乌托邦 / 末日两极，批评「身体是计算机」的神话。这条思路后来贯穿《Always On My Mind》和 OPTMZ。"}}, {"id": "literally-no-place", "date": "2023-10-26", "who": "joint", "fmt": "film", "basis": "full", "access": "free", "url": "https://jennleung.xyz/literallynoplace", "title": {"en": "Literally No Place (DIS.art)", "zh": "《Literally No Place》（DIS.art 委托影片）"}, "summary": {"en": "Part two of “I'm So Janky”, on AI's hype–doom dialectic (written and directed by Felstead, 3D by Leung, producer Lauren Boyle, DIS commission). AI Julia Fox, “the final boss of vocal fry”, tours the AI utopian vs doomer “cyberwarfare bedlam”: post-scarcity luxury or extinction? It surveys the visions of Sam Altman and Sundar Pichai. Made with Stable Diffusion, D-ID, Runway, Descript and UE5. Later screened widely and featured in the book Choreomata (Routledge). Undated on DIS; placed by the Dazed coverage (late Oct 2023).", "zh": "「I'm So Janky」系列第二部，讲 AI 的「炒作 - 末日」辩证法。Felstead 编剧兼导演，Leung 做 3D 动画，制片 Lauren Boyle，DIS 委托。AI Julia Fox 自称「气泡音的最终 boss」，上一集对付了扎克伯格的元宇宙，这一次带观众进入「AI 乌托邦派 vs. AI 末日派」的混战：AI 会带来马克思设想的后稀缺社会，让人人享受无需劳动的奢华，还是会把人类灭绝？片中呈现 Sam Altman、Sundar Pichai 等科技领袖的愿景，以及「AI 迷」的投射。内容、化身和声音用 Stable Diffusion、D-ID、Runway、Descript 和 UE5 生成；片尾致谢「互联网」。片子后来在柏林影评人周、PAF、Foto Colectania、PhotoVogue 等放映，并被收入《Choreomata: Performance and Performativity after AI》一书（Routledge，Trillo 与 Poliks 编）。DIS 页面无日期，按 Dazed 同期报道定在 2023 年 10 月下旬。"}, "people": "Daniel Felstead, Jenn Leung; producer Lauren Boyle", "nm": {"en": "Entirely about AI futures; per Felstead (COEVAL) it closes on an image of K's Pharmako-AI, the earliest direct link to K in the films.", "zh": "整部片子讨论 AI 的未来想象。Felstead 在 COEVAL 访谈中说片尾放了一张 K《Pharmako-AI》的图片，这是作品与 K 最早的直接关联。"}, "links": [{"url": "https://dis.art/series/im-so-janky", "label": {"en": "“I'm So Janky” series on DIS", "zh": "DIS 上的「I'm So Janky」系列"}}, {"url": "https://www.youtube.com/watch?v=BM1VJfMqbIE", "label": {"en": "COEVAL clip (YouTube)", "zh": "COEVAL 片段（YouTube）"}}], "date_display": {"en": "late Oct 2023 (inferred from Dazed)", "zh": "2023 年 10 月下旬（据 Dazed 报道推断）"}}, {"id": "bodystack-summit", "date": "2023-09-21", "who": "felstead", "fmt": "summit", "basis": "description", "access": "free", "url": "https://www.youtube.com/watch?v=H0X8C8WmCUM", "title": {"en": "BODYSTACK summit (LCF): “Our Bodies in the Platform Stacks”", "zh": "BODYSTACK 峰会：平台堆栈中的身体"}, "summary": {"en": "The MA FMC summit of 21–22 Sep 2023, organised by Felstead, putting bodies in Bratton's platform ‘Stack’. Public videos include Günseli Yalcinkaya's “Cryptid: A Theory of Post-Digital Selfhood”; Felstead later singled out Alexi Alario's talk on LOONA's ‘Loonaverse’ lore.", "zh": "MA 时尚媒体与传播课程 2023 年 9 月 21–22 日的峰会，Felstead 主办（他在 COEVAL 访谈里说「我 2023 年 9 月组织的 BODYSTACK 峰会」）。题目把 Benjamin Bratton「堆栈」（全球计算基础设施的分层模型）和身体放在一起。公开录像之一是 Günseli Yalcinkaya 的演讲「Cryptid: A Theory of Post-Digital Selfhood」（隐兽：后数字自我理论）；Felstead 在 COEVAL 访谈中特别提到 Alexi Alario 讲 K-pop 组合 LOONA 的「Loonaverse」世界设定的演讲。"}, "people": "Daniel Felstead (organiser); Günseli Yalcinkaya, Alexi Alario and others", "date_display": {"en": "21–22 Sep 2023", "zh": "2023 年 9 月 21–22 日"}}, {"id": "data-dolly-eschalon", "date": "2023-08-13", "who": "leung", "fmt": "exhibition", "basis": "description", "access": "free", "url": "https://thehart.com.hk/events/welcome-take-a-seat-wherever", "title": {"en": "Data Dolly Eschalon (with Miri), in “Welcome >_< Take a Seat Wherever” (HART × Tomorrow Maybe, Hong Kong)", "zh": "《Data Dolly Eschalon》（与 Miri 合作）参展香港「歡迎光臨矛盾漩渦」"}, "summary": {"en": "A group show at Tomorrow Maybe, Eaton HK (13 Aug–3 Sep 2023; curated by Angela Liu; HART). Leung and data modeller Miri made an interactive game, an ‘online girl's’ room of compressed citations and data traces with a cross-spatial Twitch stream and an AI character, Dolly, you can activate and talk to.", "zh": "香港 Eaton 酒店 Tomorrow Maybe 空间的群展（2023 年 8 月 13 日–9 月 3 日，策展 Angela Liu，HART 与 Tomorrow Maybe 支持）。Leung 和数据建模师 Miri 做了一个可互动的游戏：一个「网络女孩」的房间，塞满压缩的引用、数据痕迹和一个跨空间的 Twitch 直播，按空格键可以激活 / 关闭 AI 角色「Dolly」并跟她说话，点汽水可以推流到 Twitch。作品的说法是「一个网络女孩是构成主体本身的一部法典」。"}, "people": "Jenn Leung, Miri; curator Angela Liu", "date_display": {"en": "13 Aug – 3 Sep 2023", "zh": "2023 年 8 月 13 日–9 月 3 日"}}, {"id": "metaverse-in-janky-capitalism", "date": "2023-04-25", "who": "joint", "fmt": "film", "basis": "full", "access": "free", "url": "https://www.dis.art/the-metaverse-in-janky-capitalism", "title": {"en": "The Metaverse in Janky Capitalism (DIS.art)", "zh": "《Janky 资本主义中的元宇宙》（DIS.art 委托影片）"}, "summary": {"en": "Part one of “I'm So Janky” (written and produced by Felstead, 3D by Leung, producer Lauren Boyle, DIS commission). An AI Julia Fox muses in robotic vocal fry on how internet dynamics shape ideological trends; Facebook's metaverse is sanitised and uncannily smooth, while capitalism is janky, partly from “the sloppy and frustrating interaction between online and offline life”. Janky Capitalism is “the jacked-up Uber Eats delivery bike … cool as fuck, kind of”. Julia began as a Convai in-game NPC, voice trained with Descript. Shown on Joshua Citarella's Monday Night Memes and at NYU ITP Camp Cinema Club. Release date inferred from Felstead's Instagram (c. 25 Apr 2023).", "zh": "「I'm So Janky」系列第一部，Felstead 编剧和制作，Leung 做 3D 动画，制片 Lauren Boyle，DIS 委托。叙述者是一个「无法抗拒的漫不经心」的 AI Julia Fox：她本人就擅长制造和操纵潮流，在片中用机器人式的气泡音琢磨网络动态怎样塑造意识形态潮流。片子的论点是：扎克伯格版元宇宙被消毒得「诡异地光滑」，而真实的资本主义是 janky 的，原因之一是线上线下生活之间草率、令人沮丧的互动。系列给「janky 资本主义」的比喻是「改装过的 Uber Eats 外卖电动车」：笨拙、低效、拼凑、勉强能用、可能会要你的命，「但有点酷」。Julia 最初是用 Convai 对话 AI 插件做的游戏 NPC，声音用 Descript 训练。片子在 Joshua Citarella 主持的 Do Not Research「Monday Night Memes」直播、纽约大学 ITP Camp 电影俱乐部（与 Hito Steyerl 等的作品同场）放映。上线日期按 Felstead 的 Instagram 帖子推断为 2023 年 4 月 25 日前后。"}, "people": "Daniel Felstead, Jenn Leung; producer Lauren Boyle", "nm": {"en": "An AI-generated celebrity avatar as narrator is itself an experiment in future media; the target is the metaverse as ‘next internet’.", "zh": "用 AI 生成的名人化身当叙述者，本身就是对未来媒介形态的实验；批评的对象是元宇宙这一「下一代互联网」叙事。"}, "links": [{"url": "https://jennleung.xyz/jankycapitalism", "label": {"en": "Project page (Jenn Leung)", "zh": "项目页（Jenn Leung）"}}], "date_display": {"en": "c. 25 Apr 2023 (inferred from Instagram)", "zh": "约 2023 年 4 月 25 日（据 Instagram 推断）"}}, {"id": "vtuber-studio", "date": "2023-03-06", "who": "leung", "fmt": "project", "basis": "description", "access": "free", "url": "https://github.com/Off-World-Live-Collaborative/VTuberStudio", "title": {"en": "VTuber Studio: open-source Unreal Engine live-streaming template (Off World Live)", "zh": "VTuber Studio：开源虚幻引擎直播模板（Off World Live）"}, "summary": {"en": "An open-source Unreal Engine template Leung developed for Off World Live (repo created 6 Mar 2023): Mediapipe full-body tracking, Twitch chat interactivity, viewport/CineCam/360 capture, virtual webcam, Spout/NDI, RTMP streaming and sample avatars, for VTubers and streamers.", "zh": "Leung 为 Off World Live（虚幻引擎直播 / 采集工具公司）开发的开源项目模板，GitHub 仓库建于 2023 年 3 月 6 日，说明是「OWL VTuber Studio for Live-Streaming」。功能包括 Mediapipe 全身动捕、Twitch 聊天互动、视口 / 电影机 / 360 度采集、虚拟摄像头、Spout/NDI 输出、RTMP 推流，以及 VRM、MetaHuman 等示例化身，方便虚拟主播和游戏主播快速搭建自己的直播间。Leung 的 YouTube 上有配套教程。"}, "people": "Jenn Leung; Off World Live", "links": [{"url": "https://jennleung.xyz/vtuberstudio", "label": {"en": "Project page", "zh": "项目页"}}], "date_display": {"en": "6 Mar 2023 (repo created)", "zh": "2023 年 3 月 6 日（GitHub 仓库创建）"}}, {"id": "hyperhyperbodies-summit", "date": "2023-02-09", "who": "joint", "fmt": "summit", "basis": "listing", "access": "free", "url": "https://jennleung.xyz/workshops", "title": {"en": "HYPERHYPERBODIES summit (LCF, with International Magic), with K Allado-McDowell and Mat Dryhurst", "zh": "HYPERHYPERBODIES 峰会（与 International Magic 合办，K Allado-McDowell 演讲）"}, "summary": {"en": "The MA FMC summit of 9–10 Feb 2023, organised by Felstead with International Magic and co-curated by Leung, on AI, fashion and bodies. Speakers included K Allado-McDowell and Mat Dryhurst: the earliest overlap we found between K and the duo's events. No public recording found.", "zh": "MA 时尚媒体与传播课程 2023 年 2 月 9–10 日的峰会，Felstead 主办，与创意机构 International Magic 合作，Leung 网站列为她联合策划的峰会之一，主题是 AI、时尚与身体。演讲者包括 K Allado-McDowell 和 Mat Dryhurst（Holly Herndon 的合作者，Spawning 联合创始人）。这是我们找到的 K 与两人活动最早的交集，比 BUFF 峰会早两年。我们没有找到这场的公开录像。"}, "people": "Daniel Felstead, Jenn Leung (organisers); K Allado-McDowell, Mat Dryhurst and others", "nm": {"en": "K spoke here: the earliest direct link we found (Feb 2023).", "zh": "K 本人在这里演讲，是我们找到的与 K 最早的直接联系（2023 年 2 月）。"}, "date_display": {"en": "9–10 Feb 2023", "zh": "2023 年 2 月 9–10 日"}}, {"id": "ghost-stories-dfw", "date": "2023-02-01", "who": "leung", "fmt": "film", "basis": "description", "access": "free", "url": "https://www.youtube.com/watch?v=zdC1ZRU-j7w", "title": {"en": "Ghost Stories / Ghost Stories: A New World (Digital Fashion Week London 2022 & 2023, with Jivomir Domoustchiev)", "zh": "《Ghost Stories》数字时装影片（伦敦数字时装周 2022、2023）"}, "summary": {"en": "Two digital fashion works co-directed with Jivomir Domoustchiev (Leung: environment design, rigging, optimisation). Part one played on a 23-metre LED wall at W1 Curates for Digital Fashion Week London 2022; the sequel, Ghost Stories: A New World, screened at Epic Games Innovation Lab's virtual production studio (Feb 2023), with cloth-simulated garments on MoCap MetaHumans in UE5.", "zh": "与设计师 Jivomir Domoustchiev 联合导演的两部数字时装作品，Leung 负责环境设计、绑定和优化。第一部在 2022 年伦敦数字时装周的 W1 Curates 播放，投在 23 米长的 LED 墙上：受生存游戏和流亡启发，六个穿着「幽灵盔甲」的化身站在城市开放世界里。续篇《Ghost Stories: A New World》2023 年 2 月在 Epic Games 创新实验室的虚拟制片棚放映，用 UE5 渲染、动捕驱动的 MetaHuman 和布料模拟展示数字服装。这个系列也跨平台做进了 Unity、Web3 区块链游戏和 Sandbox 等化身里，Domoustchiev 的 A/W23 系列也在 SHOWstudio 上发布。"}, "people": "Jenn Leung, Jivomir Domoustchiev", "links": [{"url": "https://jennleung.xyz/ghoststories", "label": {"en": "Project page", "zh": "项目页"}}, {"url": "https://www.showstudio.com/collections/autumn-winter-2023/Jivomir-Domoustchiev-aw-23-womenswear", "label": {"en": "SHOWstudio: Domoustchiev A/W23", "zh": "SHOWstudio：Domoustchiev A/W23"}}], "date_display": {"en": "Feb 2023 (sequel); part one 2022", "zh": "2023 年 2 月（续篇）；第一部 2022 年"}}, {"id": "ual-gaf-interview", "date": "2022-10-04", "who": "felstead", "fmt": "interview", "basis": "full", "access": "free", "url": "https://www.arts.ac.uk/colleges/london-college-of-fashion/stories/ma-fashion-media-and-communication-course-leader-daniel-felstead-presents-at-global-art-forum", "title": {"en": "UAL story: MA Fashion Media and Communication Course Leader Daniel Felstead presents at Global Art Forum", "zh": "伦敦艺术大学专访：Felstead 谈在迪拜全球艺术论坛的元宇宙演讲"}, "summary": {"en": "A UAL Q&A (4 Oct 2022) on his Global Art Forum talk. The metaverse is “fiction all the way down”, a speculative performativity that talks itself into being; after Byung-Chul Han we are entering an age of non-objects; ‘meta-’ means ‘in-between’; Web3 has socio-political potential beyond speculation. Also on the MA FMC course's focus on AI, gaming and hybrid fashion experiences.", "zh": "伦敦艺术大学 2022 年 10 月 4 日发布的问答，回顾他 3 月在迪拜全球艺术论坛的演讲。他的观点：元宇宙「从头到尾都是虚构」，它是一种「推测性的述行」，即靠讲述它来召唤它出现；他借韩炳哲的「非物」（non-objects）说我们正进入一个以信息而非物品为中心的时代；「meta-」这个前缀本义是「在……之间」，元宇宙的意义恰在这种模糊的中间状态；他也认为 Web3 有社会政治上的潜力，不该只被看成投机泡沫。他同时介绍了 MA 时尚媒体与传播课程的方向：AI、游戏和混合式时尚体验。"}, "people": "Daniel Felstead", "nm": {"en": "On ‘next internet’ narratives (metaverse, Web3) and the age of non-objects: the theory behind his later metaverse film.", "zh": "讨论「下一代互联网」叙事（元宇宙、Web3）与信息时代的「非物」，是他后来批评元宇宙的影片的理论前奏。"}}, {"id": "hyperbodies-summit", "date": "2022-09-01", "who": "felstead", "fmt": "summit", "basis": "listing", "access": "free", "url": "https://www.arts.ac.uk/subjects/fashion-communication/postgraduate/ma-fashion-media-and-communication-lcf", "title": {"en": "HYPERBODIES: the first MA Fashion Media & Communication summit", "zh": "HYPERBODIES：MA 时尚媒体与传播课程的第一场峰会"}, "summary": {"en": "We saw HYPERBODIES (Sep 2022) named only in secondary material as the first of Felstead's course summits, followed by body-themed summits through to BUFF (neural media, 2025) and OPTMZ (2026), the main channel bringing K and the New Models orbit into a fashion school. No line-up or recording found for HYPERBODIES.", "zh": "我们只在二手资料里见到「HYPERBODIES」这个名字和 2022 年 9 月这个时间，它被说成是 Felstead 为这门课办的第一场峰会。此后的峰会题目都以「身体」为轴：HYPERHYPERBODIES（2023 年 2 月）、BODYSTACK（2023 年 9 月）、BODYSTACKED（2024）、BUFFER（2024 年 9 月）、BUFF（2025 年 1 月，神经媒体）、EXCESSS（2025 年 9 月）、OPTMZ（2026 年 1 月）。这套峰会是两人把 K、New Models 周边的理论家和艺术家请进时尚学院的主要渠道。HYPERBODIES 本身没有找到嘉宾名单或录像。"}, "people": "Daniel Felstead", "date_display": {"en": "Sep 2022", "zh": "2022 年 9 月"}}, {"id": "gaf15-kissed-in-the-metaverse", "date": "2022-03-13", "who": "felstead", "fmt": "talk", "basis": "description", "access": "free", "url": "https://www.youtube.com/watch?v=Zap9BSBdmPg", "title": {"en": "“What If We Kissed In The Metaverse”, Global Art Forum 15 (Dubai), with Ruba Al-Sweel, hosted by Shumon Basar", "zh": "迪拜全球艺术论坛第 15 届：「如果我们在元宇宙里接吻」（与 Ruba Al-Sweel，主持 Shumon Basar）"}, "summary": {"en": "A Global Art Forum 15 (“This is the Picture”) session on 13 Mar 2022 with Ruba Al-Sweel, hosted by Shumon Basar; video posted 29 Mar 2022. Per the later UAL interview: the metaverse as speculative performativity, its ambiguity both strength and flaw. Al-Sweel later spoke at BUFF.", "zh": "2022 年 3 月 13 日迪拜全球艺术论坛第 15 届（主题「This is the Picture」）的一场对谈，Felstead 与研究游戏和数字文化的 Ruba Al-Sweel 同台，主持是论坛长期策划人、作家 Shumon Basar（《The Age of Earthquakes》合著者）。录像 3 月 29 日上传。内容见伦敦艺术大学之后的专访：元宇宙是「推测性的述行」，是一个靠被讲述而成形的虚构；它的模糊既是最大优势，也是最大缺陷。Ruba Al-Sweel 后来也是 BUFF 峰会的讲者。"}, "people": "Daniel Felstead, Ruba Al-Sweel; host Shumon Basar", "nm": {"en": "On the metaverse as a future-internet vision: an early record of Felstead on new-media futures.", "zh": "讨论元宇宙这一「未来互联网」愿景，是 Felstead 公开谈新媒介未来的早期记录。"}, "links": [{"url": "https://www.arts.ac.uk/colleges/london-college-of-fashion/stories/ma-fashion-media-and-communication-course-leader-daniel-felstead-presents-at-global-art-forum", "label": {"en": "UAL interview about the talk", "zh": "伦敦艺术大学关于这场演讲的专访"}}]}, {"id": "dae-unfolding-spaces-xalon", "date": "2022-03-01", "who": "leung", "fmt": "talk", "basis": "description", "access": "free", "url": "https://www.designacademy.nl/page/5590/dae-research-festival", "title": {"en": "Xalon at Design Academy Eindhoven Research Festival “Unfolding Spaces”", "zh": "Xalon 在埃因霍温设计学院研究节「展开的空间」"}, "summary": {"en": "In March 2022 Leung presented Xalon's real-time networked environment (MQTT, pose estimation) at DAE's Research Festival “Unfolding Spaces”. Xalon is her XR collective with Arshiya Vij and Serra Ozdemir, on inclusive, embodied real-time collaboration in networked XR.", "zh": "2022 年 3 月，Leung 在埃因霍温设计学院研究节「Unfolding Spaces」展示 Xalon 的实时联网环境：用 MQTT 消息协议和姿态估计，让不同地点的人以身体动作在同一个 XR 空间里协作。Xalon 是她与 Arshiya Vij、Serra Ozdemir 组成的 XR 集体，关注 XR 中的包容性、伦理、可持续和身体化的实时协作。"}, "people": "Jenn Leung, Arshiya Vij, Serra Ozdemir", "date_display": {"en": "Mar 2022", "zh": "2022 年 3 月"}}, {"id": "xalon-2022", "date": "2022-02-01", "who": "leung", "fmt": "teaching", "basis": "description", "access": "free", "url": "https://jennleung.xyz/xalon", "title": {"en": "Xalon 2022: AA Visiting School Unit 5 “About a new togetherness”, Xalon Lecture Series, CIVA Vienna", "zh": "Xalon 2022：AA 访问学校第五单元、讲座系列与维也纳 CIVA 艺术节"}, "summary": {"en": "Xalon in early 2022: Leung led AA Visiting School Unit 5 “Xalon: About a new togetherness” (Feb–Jul 2022), ran the Xalon Lecture Series (Jan–Mar 2022), and took part in CIVA Vienna (Feb 2022), MONA Gallery, a Posthuman Symposium and Wipro's Thursday Talks.", "zh": "Xalon 在 2022 年上半年的活动：Leung 担任建筑联盟学院（AA）访问学校第五单元「Xalon: About a new togetherness」（关于一种新的共处，2022 年 2–7 月）的项目负责人；办了 Xalon 讲座系列（2022 年 1–3 月）；参加维也纳 CIVA 媒体艺术节（2022 年 2 月）、MONA 画廊和后人类研讨会；还在 Wipro 的「Thursday Talks」上做过分享。导师包括 Fiona Zisch、Alex Whitley 等。"}, "people": "Jenn Leung, Arshiya Vij, Serra Ozdemir", "date_display": {"en": "Jan–Jul 2022", "zh": "2022 年 1–7 月"}}, {"id": "mafmc-founded", "date": "2022-01-01", "who": "felstead", "fmt": "teaching", "basis": "description", "access": "free", "url": "https://www.arts.ac.uk/subjects/fashion-communication/postgraduate/ma-fashion-media-and-communication-lcf", "title": {"en": "Felstead founds and leads MA Fashion Media & Communication (London College of Fashion, UAL)", "zh": "Felstead 创办并主持伦敦时装学院 MA 时尚媒体与传播课程"}, "summary": {"en": "Per the OPTMZ bio, Felstead founded the MA Fashion Media & Communication at LCF (UAL) in 2022 and leads it; earlier he led MA/BA Fashion Media Practice & Criticism (SHOWstudio bio). Students work on AI, gaming and hybrid fashion experiences (Holloway Express). Leung teaches at the same college; their students worked on the films.", "zh": "OPTMZ 峰会的嘉宾介绍说，Felstead 在 2022 年创办了伦敦时装学院（UAL）的 MA 时尚媒体与传播（Fashion Media & Communication）课程，并任课程主任；此前他主持过 MA / BA 时尚媒体实践与批评课程（据 SHOWstudio 简介）。按 Holloway Express 的介绍，学生在课上直接钻研 AI、游戏和混合式时尚体验，目标是培养能塑造时尚媒体未来的多面手。Leung 是同一学院的创意技术与设计高级讲师，两人一起带学生研究神经媒体，这些学生后来也参与了影片制作（如《Welcome to Jankspace》的 3D 建模）。"}, "people": "Daniel Felstead", "date_display": {"en": "2022", "zh": "2022 年"}}, {"id": "bartlett-hayles-lecture", "date": "2021-12-01", "who": "leung", "fmt": "talk", "basis": "listing", "access": "free", "url": "https://jennleung.xyz/xalon", "title": {"en": "Moderating “A Cognitive Framework”: N. Katherine Hayles, Bartlett International Lecture Series (UCL)", "zh": "主持巴特莱特国际讲座：N. Katherine Hayles「一个认知框架」"}, "summary": {"en": "In Dec 2021 Leung (with Xalon) moderated N. Katherine Hayles's Bartlett International Lecture “A Cognitive Framework”. Hayles (How We Became Posthuman) proposes ‘nonconscious cognition’ extending cognition to animals, plants and computers. Title only.", "zh": "2021 年 12 月，Leung（以 Xalon 名义）主持了伦敦大学学院巴特莱特建筑学院国际讲座系列中 N. Katherine Hayles 的讲座「A Cognitive Framework」。Hayles 是《我们如何成为后人类》的作者，近年提出「非意识认知」（nonconscious cognition）框架，把认知扩展到动物、植物和计算机。我们只读到 Leung 网站上的标题记录。"}, "people": "Jenn Leung (moderator); N. Katherine Hayles", "date_display": {"en": "Dec 2021", "zh": "2021 年 12 月"}}, {"id": "ars-electronica-polysocial", "date": "2021-09-08", "who": "leung", "fmt": "panel", "basis": "listing", "access": "free", "url": "https://jennleung.xyz/xalon", "title": {"en": "PolySocial Realities panel, Ars Electronica 2021 (Xalon)", "zh": "林茨电子艺术节 2021：「多重社交现实」对谈（Xalon）"}, "summary": {"en": "Leung curated and hosted the “PolySocial Realities” panel (community building and networked environments) at Ars Electronica with Xalon. Her talks list says 2020; the Xalon page and CV say 2021, which we follow (festival 8–12 Sep 2021). Title only.", "zh": "Leung 以 Xalon 名义在林茨电子艺术节策划并主持「PolySocial Realities」对谈，讨论社群建设和联网环境。她的讲座列表写作 2020 年，Xalon 页面和简历写作 Ars Electronica 2021，这里按 2021 年（当年主题「A New Digital Deal」，9 月 8–12 日）列出。只读到标题记录。"}, "people": "Jenn Leung; Xalon", "date_display": {"en": "Sep 2021 (talks list says 2020)", "zh": "2021 年 9 月（talks 列表写作 2020，存疑）"}}, {"id": "leung-group-shows-2021", "date": "2021-06-26", "who": "leung", "fmt": "exhibition", "basis": "listing", "access": "free", "url": "https://tzvetnik.online/article/tek-kwun-at-tai-kwun-centre-for-heritage-and-arts-hong-kong", "title": {"en": "Group shows 2020–21: Tek Kwun (Tai Kwun), prsntprsnt “Camouflage”, BSMNT Leipzig “TUTORIAL”, NNN, soloshow.online, Underground Flower and others", "zh": "2020–2021 年群展合集：大馆 Tek Kwun、prsntprsnt「Camouflage」、莱比锡「TUTORIAL」等"}, "summary": {"en": "Leung's early group shows as a digital/3D artist, from her site and press: Tek Kwun at Tai Kwun, prsntprsnt's off-site “Camouflage”, BSMNT Leipzig's “TUTORIAL” (all covered by Tzvetnik), NNN, Sundae Matsudo, MAMAN/TOXICFEST Antwerp, Fold × Futur.shock, and in 2020 soloshow.online and Underground Flower's “Cellophane Mother Memory”. Dates not individually verified; merged into one entry placed mid-2021.", "zh": "Leung 早期以数字 / 3D 艺术家身份参加的一批群展，来自她网站的展览列表和外部报道：香港大馆的「Tek Kwun」、prsntprsnt 在西贡 Shui Long Wo 的离场展「Camouflage」、莱比锡 BSMNT 的「TUTORIAL」小组项目（以上有 Tzvetnik 报道），以及 NNN 艺术博览会、千叶 Sundae Matsudo、安特卫普 MAMAN / TOXICFEST、Fold × Futur.shock，2020 年的 soloshow.online 和香港 Underground Flower 的「Cellophane Mother Memory」。各展的具体日期没有逐一核实，这里合并成一条，日期取 2021 年年中。"}, "people": "Jenn Leung", "links": [{"url": "https://tzvetnik.online/article/camouflage-off-site-show-by-prsntprsnt-in-shui-long-wo-sai-kung-hong-kong", "label": {"en": "Tzvetnik: Camouflage", "zh": "Tzvetnik：Camouflage"}}, {"url": "https://tzvetnik.online/article/tutorial-group-project-at-bsmnt-leipzig", "label": {"en": "Tzvetnik: TUTORIAL", "zh": "Tzvetnik：TUTORIAL"}}, {"url": "https://www.artasiapacific.com/blog/herenowandthenewbabyloninterviewwithprsntprsnt/", "label": {"en": "ArtAsiaPacific: prsntprsnt interview", "zh": "《藝術亞太》：prsntprsnt 访谈"}}], "date_display": {"en": "2020–21 (dates not individually verified)", "zh": "2020–2021 年（日期未逐一核实）"}}, {"id": "showstudio-tech-change-fashion", "date": "2020-09-27", "who": "felstead", "fmt": "panel", "basis": "listing", "access": "free", "url": "https://www.youtube.com/watch?v=Aa9rRRAOiXY", "title": {"en": "SHOWstudio panel: “How Will Technology Change Fashion?”", "zh": "SHOWstudio 对谈：「科技将如何改变时尚？」"}, "summary": {"en": "A SHOWstudio panel video (27 Sep 2020), “How Will Technology Change Fashion?”, with Felstead among the guests, against the pandemic shift to digital shows and virtual garments. No transcript; title only.", "zh": "Nick Knight 创办的时尚影像平台 SHOWstudio 2020 年 9 月 27 日发布的线上对谈录像，题目是「科技将如何改变时尚」，Felstead 是嘉宾之一（他当时主持伦敦时装学院的时尚媒体实践与批评课程）。疫情期间时尚业被迫转向数字发布、虚拟服装和线上展示，这是讨论背景。我们没有取得字幕，只按标题列出。"}, "people": "Daniel Felstead and others", "nm": {"en": "On technology and fashion's future: Felstead's earliest public recording on future media.", "zh": "主题是科技与时尚的未来（虚拟服装、数字发布），是 Felstead 谈「未来媒介」最早的公开录像。"}}, {"id": "felstead-phd-sehgal", "date": "2018-03-01", "who": "felstead", "fmt": "paper", "basis": "abstract", "access": "free", "url": "https://repository.cssd.ac.uk/id/eprint/761", "title": {"en": "PhD thesis: “What Can We Do With These Associations? Production, Organisation and Materiality in the Work of Tino Sehgal” (Royal Central School of Speech & Drama)", "zh": "博士论文：〈我们能拿这些关联做什么？Tino Sehgal 作品中的生产、组织与物质性〉"}, "summary": {"en": "Felstead's PhD (Royal Central School of Speech & Drama, deposited 1 Mar 2018) on Tino Sehgal, whose works consist only of human actions and ‘constructed situations’, with no objects or photos. It asks how such work is produced and organised and where its materiality lies; his Lisbon bio sums it up as speculative modes of production, complex systems and the platform in participatory art.", "zh": "Felstead 在伦敦皇家中央演讲与戏剧学院的博士论文（2018 年 3 月 1 日入库）。研究对象是艺术家 Tino Sehgal：他的作品只由人的动作、对话和「情境」构成，不留任何实物，不准拍照，买卖靠口头合同。论文讨论这种作品怎样被生产、组织，以及它的「物质性」到底在哪里。里斯本讲座简介把这项研究概括为探讨「推测性的生产方式、复杂系统和平台」与参与式艺术的关系。这条线索解释了他后来的思路：把元宇宙、AI 和「jankspace」都看成由人的行为和叙述维持的系统。"}, "people": "Daniel Felstead", "date_display": {"en": "1 Mar 2018 (deposited)", "zh": "2018 年 3 月 1 日（入库）"}}]}, "pages": [{"key": "home", "file": "index.html", "label": {"en": "Neural Media", "zh": "神经媒体总览"}}, {"key": "who-else", "file": "who-else.html", "label": {"en": "Who else", "zh": "其他研究者"}}, {"key": "bci", "file": "bci.html", "label": {"en": "BCI × Neural Media", "zh": "脑机接口与神经媒体"}}, {"key": "new-models", "file": "new-models.html", "label": {"en": "New Models", "zh": "New Models 与 Lil Internet"}}, {"key": "felstead-leung", "file": "felstead-leung.html", "label": {"en": "Felstead & Leung", "zh": "Felstead 与 Leung"}}]};</script>
<script>(function () {
  "use strict";
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  // Bilingual helper: renders an en span and a zh span; CSS decides what is visible.
  function bi(o, tag) {
    tag = tag || "span";
    if (!o) return "";
    return '<' + tag + ' class="t en" lang="en">' + esc(o.en) + '</' + tag + '>' +
           '<' + tag + ' class="t zh" lang="zh-Hans">' + esc(o.zh) + '</' + tag + '>';
  }
  function ext(url, inner, cls) {
    return '<a ' + (cls ? 'class="' + cls + '" ' : "") + 'href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + inner + "</a>";
  }
  // Internal link to another page of this site (keeps the language choice).
  function intl(href, inner, cls) {
    return '<a ' + (cls ? 'class="' + cls + '" ' : "") + 'data-internal href="' + esc(href) + '">' + inner + "</a>";
  }
  // YouTube: lite click-to-play embed. Shows the video's own thumbnail (lazy-loaded) with a play
  // button; clicking swaps in a youtube-nocookie iframe with autoplay. The "Open on YouTube" link
  // stays as a fallback (e.g. when the embed is blocked or the page is opened from disk).
  function ytId(u) {
    var m = /^https:\/\/(?:www\.|m\.)?(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|live\/|shorts\/)|youtu\.be\/)([\w-]{11})/.exec(u || "");
    return m ? m[1] : null;
  }
  function ytStart(u) { var m = /[?&#](?:t|start)=(\d+)s?/.exec(u || ""); return m ? m[1] : ""; }
  function yt(url, label, opt) {
    opt = opt || {};
    var id = ytId(url); if (!id) return "";
    var st = ytStart(url);
    var cap = label ? '<span class="yt-cap">' + bi(label) + '</span>' : "";
    return '<div class="yt' + (opt.cls ? " " + opt.cls : "") + '" data-yt="' + id + '"' + (st ? ' data-start="' + st + '"' : "") + '>' +
      '<button type="button" class="yt-cover" aria-label="Play video · 播放视频' + (label ? ": " + esc(label.en) : "") + '">' +
        '<img loading="lazy" decoding="async" alt="" src="https://i.ytimg.com/vi/' + id + '/hqdefault.jpg"' + (opt.fallback ? ' data-fb="' + esc(opt.fallback) + '"' : "") + '>' +
        '<span class="yt-play" aria-hidden="true"></span>' + cap + '</button>' +
      '<a class="yt-open" href="https://www.youtube.com/watch?v=' + id + (st ? "&t=" + st + "s" : "") + '" target="_blank" rel="noopener noreferrer">' +
        bi({ en: "Open on YouTube ↗", zh: "在 YouTube 打开 ↗" }) + '</a></div>';
  }
  // All YouTube videos of an entry: its own url first, then its links (deduplicated by id).
  function ytList(url, title, links) {
    var seen = {}, out = [];
    var add = function (u, lab) { var id = ytId(u); if (id && !seen[id]) { seen[id] = 1; out.push({ url: u, label: lab }); } };
    add(url, title); (links || []).forEach(function (l) { add(l.url, l.label); });
    return out;
  }
  function ytRow(list, cls) {
    if (!list.length) return "";
    return '<div class="yt-row' + (list.length > 1 ? " multi" : "") + (cls ? " " + cls : "") + '">' +
      list.map(function (v) { return yt(v.url, list.length > 1 || v.force ? v.label : null); }).join("") + '</div>';
  }
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest && ev.target.closest(".yt-cover"); if (!b) return;
    var box = b.parentNode, id = box.getAttribute("data-yt"), st = box.getAttribute("data-start");
    // Opened straight from disk (file://) YouTube refuses to play embeds (no referrer → "configuration error"),
    // so open the video on YouTube instead; on any http(s) host it plays inline.
    if (location.protocol === "file:") { window.open("https://www.youtube.com/watch?v=" + id + (st ? "&t=" + st + "s" : ""), "_blank", "noopener"); return; }
    var f = document.createElement("iframe");
    f.src = "https://www.youtube-nocookie.com/embed/" + id + "?autoplay=1&rel=0&playsinline=1" + (st ? "&start=" + st : "");
    f.title = "YouTube video player";
    f.setAttribute("allow", "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share");
    f.setAttribute("allowfullscreen", "");
    f.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
    f.className = "yt-frame";
    box.replaceChild(f, b); box.classList.add("playing");
  });
  // If a YouTube thumbnail fails, fall back to the bundled local copy when there is one.
  document.addEventListener("error", function (ev) {
    var t = ev.target;
    if (t && t.tagName === "IMG" && t.getAttribute("data-fb")) { var fb = t.getAttribute("data-fb"); t.removeAttribute("data-fb"); t.src = fb; }
  }, true);

  function feature(F) {
    var A = F.argument, S = F.structure, V = F.versions, C = F.chain;
    var cta = F.cta.map(function (c) { return ext(c.url, bi(c.label) + ' <span aria-hidden="true">↗</span>', "btn" + (c.primary ? " primary" : "")); }).join("");
    var pts = A.points.map(function (p, pi) {
      return '<li class="fpoint"><span class="fpn">' + (pi + 1 < 10 ? "0" : "") + (pi + 1) + '</span><h5>' + bi(p.term) + '</h5>' +
        '<div class="who-line">' + bi(p.text, "p") + '</div>' + (p.quote ? '<blockquote class="fq">' + bi(p.quote, "p") + '</blockquote>' : "") + '</li>';
    }).join("");
    var parts = S.parts.map(function (pt) {
      return '<li class="fpart">' +
        '<div class="fpart-head">' + ext(pt.url, '<span class="fr">' + esc(pt.num) + '</span><span class="fname">' + bi(pt.name) + '</span>') +
          '<div class="fquest">' + bi(pt.question) + '</div></div>' +
        '<div class="fpart-body"><div class="who-line">' + bi(pt.text, "p") + '</div>' +
          '<ol class="fsecs">' + pt.sections.map(function (s) { return '<li>' + bi(s) + '</li>'; }).join("") + '</ol></div></li>';
    }).join("");
    var vers = V.entries.map(function (v) {
      var st = fmtStamp(v.date), lab = typeof v.label === "string" ? { en: v.label, zh: v.label } : v.label;
      return '<li><span class="vl">' + bi(lab) + '</span><span class="vd">' + bi(st) + '</span><div class="vt">' + bi(v.text, "p") + '</div></li>';
    }).join("");
    var chain = C.steps.map(function (s, si) {
      return '<li class="cstep"><span class="cdate">' + bi(s.date) + '</span><h5>' + ext(s.url, esc(s.who) + ' ↗') + '</h5>' +
        '<div class="who-line">' + bi(s.what, "p") + '</div></li>' + (si < C.steps.length - 1 ? '<li class="carrow" aria-hidden="true">→</li>' : "");
    }).join("");
    return '<article class="feature" id="' + esc(F.id) + '">' +
      '<div class="f-top"><div class="f-kicker">' + bi(F.kicker) + '</div>' +
        '<h3 class="f-title">' + esc(F.title) + '</h3>' +
        '<div class="f-sub">' + bi(F.subtitle, "p") + '</div>' +
        '<div class="f-byline">' + bi(F.byline) + '</div>' +
        '<figure class="f-def"><div class="fw">' + esc(F.definition.word) + '</div>' + bi(F.definition.quote, "p") +
          '<figcaption>' + bi(F.definition.note) + '</figcaption></figure>' +
        '<div class="f-cta">' + cta + '</div>' +
        '<div class="f-note">' + bi(F.note, "p") + '</div></div>' +
      '<div class="f-row f-row-a"><section class="f-author"><h4 class="f-h">' + bi(F.author.title) + '</h4>' + bi(F.author.text, "p") +
          '<div class="links">' + F.author.links.map(function (l) { return ext(l.url, bi(l.label) + " ↗"); }).join("") + '</div></section>' +
        '<section class="f-arg"><h4 class="f-h">' + bi(A.title) + '</h4><ol class="fpoints">' + pts + '</ol></section></div>' +
      '<section class="f-struct"><h4 class="f-h">' + bi(S.title) + '</h4><div class="f-struct-intro">' + bi(S.intro, "p") + '</div><ol class="fparts">' + parts + '</ol></section>' +
      '<div class="f-row f-row-b"><section class="f-vers"><h4 class="f-h">' + bi(V.title) + '</h4><ol class="vlist">' + vers + '</ol>' +
          '<div class="links">' + ext(V.source.url, bi(V.source.label) + " ↗") + '</div></section>' +
        '<section class="f-chain"><h4 class="f-h">' + bi(C.title) + '</h4><ol class="clist">' + chain + '</ol>' +
          '<div class="land-note">' + bi(C.note, "p") + '</div></section></div>' +
      '</article>';
  }
  function fmtStamp(iso) {
    var m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var p = iso.split("-");
    return { en: (+p[2]) + " " + m[+p[1] - 1] + " " + p[0], zh: p[0] + " 年 " + (+p[1]) + " 月 " + (+p[2]) + " 日" };
  }

  function render(D) {
    var st = fmtStamp(D.meta.last_updated);
    var stamp = '<div class="stamp"><i></i><span class="t en">Last updated: ' + esc(st.en) + ' (' + esc(D.meta.timezone) + ')</span>' +
                '<span class="t zh">最后更新：' + esc(st.zh) + '（' + esc(D.meta.timezone) + '）</span></div>';

    if (D.items && document.getElementById("hero")) {
    var items = D.items.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    var byId = {}; items.forEach(function (i) { byId[i.id] = i; });
    // Hero
    var h = D.hero;
    document.getElementById("hero").innerHTML =
      '<div class="kicker">' + bi(h.kicker) + '</div>' +
      '<h1><span class="t en">' + esc(h.title.en) + '</span><span class="t zh">' + esc(h.title.zh) + '</span></h1>' +
      '<p class="by">K Allado-McDowell · <span class="inline">' + bi({ en: "concept & framework", zh: "概念与理论框架" }) + '</span></p>' +
      '<div class="intro">' + bi(h.intro, "p") + '</div>' + stamp;

    // Concept
    var c = D.concept;
    var eras = c.eras.map(function (e) {
      return '<article class="era' + (e.key === "neural" ? " now" : "") + '">' +
        '<div class="span">' + esc(e.span) + '</div>' +
        '<h3>' + bi(e.name) + '</h3>' +
        '<dl><dt>Space 空间</dt><dd>' + bi(e.space) + '</dd><dt>Content 内容</dt><dd>' + bi(e.content) + '</dd><dt>Identity 身份</dt><dd>' + bi(e.identity_type) + '</dd></dl>' +
        '<div class="id">' + bi(e.identity, "p") + '</div></article>';
    }).join("");
    document.getElementById("concept").innerHTML =
      '<div class="sec-head"><span class="num">01</span><h2>' + bi({ en: "What is Neural Media", zh: "什么是神经媒体" }) + '</h2></div>' +
      '<div class="lead">' + bi(c.lead, "p") + '</div>' +
      '<div class="eras">' + eras + '</div>' +
      '<div class="timeline-bar" aria-hidden="true"><span></span><span></span><span></span><span class="now"></span></div>' +
      '<ul class="notes">' + c.notes.map(function (n) { return '<li>' + bi(n, "span") + '</li>'; }).join("") + '</ul>';

    // Timeline with type filters
    var counts = {}; items.forEach(function (i) { i.types.forEach(function (t) { counts[t] = (counts[t] || 0) + 1; }); });
    var chips = '<button class="chip" type="button" data-f="all" aria-pressed="true">' + bi({ en: "All", zh: "全部" }) + '<b>' + items.length + '</b></button>' +
      Object.keys(D.types).filter(function (k) { return counts[k]; }).map(function (k) {
        return '<button class="chip" type="button" data-f="' + k + '" aria-pressed="false">' + bi(D.types[k]) + '<b>' + counts[k] + '</b></button>';
      }).join("");
    var feed = items.map(function (i) {
      var tags = i.types.map(function (t) { return '<span class="tag ' + esc(t) + '">' + bi(D.types[t]) + '</span>'; }).join("") +
        (i.added && i.added === D.meta.last_updated && i.added > (D.meta.launched || "") ? '<span class="tag new">NEW</span>' : "");
      var links = ext(i.url, bi({ en: "Open source ↗", zh: "查看原文 ↗" })) +
        (i.internal ? intl(i.internal.href, bi(i.internal.label) + " →", "internal") : "") +
        (i.links || []).map(function (l) { return ext(l.url, bi(l.label) + " ↗"); }).join("") +
        '<span class="src">' + bi(i.source) + '</span>';

  function spy() {
    if (!spyLinks.length) return;
    var line = syncOffset() + 24, idx = -1;
    spyTargets.forEach(function (el, i) { if (el && el.getBoundingClientRect().top <= line) idx = i; });
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) idx = spyTargets.length - 1;
    var a = idx > -1 ? spyLinks[idx] : null;
    if (a === current) return;
    current = a;
    spyLinks.forEach(function (l) { if (l === a) l.setAttribute("aria-current", "true"); else l.removeAttribute("aria-current"); });
    if (a) {  // keep the active link visible in the horizontally scrolling bar on small screens
      var bar = a.parentNode, r = a.getBoundingClientRect(), br = bar.getBoundingClientRect();
      if (r.left < br.left || r.right > br.right) bar.scrollLeft += (r.left - br.left) - (br.width - r.width) / 2;
    }
  }
  var ticking = false;
  window.addEventListener("scroll", function () {
    if (!ticking) { ticking = true; requestAnimationFrame(function () { ticking = false; spy(); }); }
  }, { passive: true });
  spy();

  // On narrow screens the page nav scrolls sideways: keep the current page's tab in view.
  var curNav = document.querySelector('.nav a[aria-current="page"]');
  function navToCur() {
    if (!curNav) return;
    var navEl = curNav.closest(".nav") || curNav.parentNode;
    if (navEl.scrollWidth <= navEl.clientWidth + 1) return;
    if (!curNav.nextElementSibling) { navEl.scrollLeft = navEl.scrollWidth; return; }
    var nr = navEl.getBoundingClientRect(), cr = curNav.getBoundingClientRect();
    if (cr.right > nr.right - 4 || cr.left < nr.left) navEl.scrollLeft += (cr.right - nr.right) + 16;
  }
  navToCur(); window.addEventListener("load", navToCur);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(navToCur);

  if (location.hash) { var tgt = document.getElementById(location.hash.slice(1)); if (tgt) setTimeout(function () { tgt.scrollIntoView(); spy(); }, 0); }
})();
</script>
